<style>
/* Layout: one reading column like an open picture book; banner of the forest on top, story card with the scene's picture, then big choice buttons. */
:root {
  --bg: #EDF2EE;
  --surface: #FFFFFF;
  --ink: #1B332D;
  --muted: #566D64;
  --line: #CBD8D1;
  --lantern: #E3A21A;
  --lantern-ink: #3A2A00;
  --berry: #A8325E;
  --sky: #2F6A9E;
  --tree1: #BFD5CA;
  --tree2: #93B5A5;
  --good: #2C7A4B;
  --bad: #A8325E;
  --font-display: "Grandstander", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101C19; --surface: #172622; --ink: #E6F0EA; --muted: #9DB5AA; --line: #2B403A;
    --lantern: #F1B93A; --lantern-ink: #2A1E00; --berry: #E07AA0; --sky: #7FB4E3;
    --tree1: #1D332D; --tree2: #264339; --good: #72CE97; --bad: #E07AA0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101C19; --surface: #172622; --ink: #E6F0EA; --muted: #9DB5AA; --line: #2B403A;
  --lantern: #F1B93A; --lantern-ink: #2A1E00; --berry: #E07AA0; --sky: #7FB4E3;
  --tree1: #1D332D; --tree2: #264339; --good: #72CE97; --bad: #E07AA0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.6; padding-inline: 16px; padding-block: 16px 40px; }
.wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.15; margin: 0; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

.banner { border-radius: 20px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.banner svg { display: block; width: 100%; height: auto; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--muted); }
.bar .brand { color: var(--ink); font-weight: 800; font-size: 18px; }
.spark { display: inline-flex; gap: 6px; align-items: center; }
.spark i { width: 14px; height: 18px; border-radius: 4px 4px 7px 7px; background: var(--line); display: inline-block; }
.spark i.on { background: var(--lantern); box-shadow: 0 0 10px var(--lantern); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card h2 { font-size: 28px; font-weight: 800; }
/* Scenens billede fylder hele kortets bredde øverst; er skærmen lav, beskæres det i siderne af SVG'ens slice. */
.scene-art { margin: -22px -20px 0; border-radius: 19px 19px 0 0; overflow: hidden; background: #1E2E52; }
.scene-art svg { display: block; width: 100%; height: auto; max-height: 45vh; }
/* Lanternerækken: en smal stribe under billedet, der lyser mere, jo længere man kommer. */
.lamps { display: flex; justify-content: center; gap: 14px; margin-top: -4px; }
.lamps i { width: 12px; height: 16px; border-radius: 4px 4px 6px 6px; background: var(--line); display: block; position: relative; }
.lamps i::before { content: ""; position: absolute; left: 5px; top: -5px; width: 2px; height: 5px; background: var(--line); }
.lamps i.on { background: var(--lantern); box-shadow: 0 0 10px var(--lantern); }
.story p + p { margin-top: 12px; }
.turn { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--lantern-ink); background: var(--lantern); border-radius: 999px; padding: 3px 14px 3px 6px; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; }
.turn svg { display: block; }
.ask { border-top: 2px dotted var(--line); padding-top: 12px; font-size: 16px; color: var(--muted); }
.ask b { font-family: var(--font-display); color: var(--ink); }

.choices { display: flex; flex-direction: column; gap: 10px; }
.btn { font-family: var(--font-display); font-weight: 600; font-size: 18px; text-align: left; background: var(--surface); border: 2px solid var(--ink); border-radius: 16px; padding: 14px 16px; cursor: pointer; min-height: 52px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.btn:hover { background: var(--lantern); color: var(--lantern-ink); border-color: var(--lantern); }
.btn[disabled] { opacity: .45; cursor: default; text-decoration: line-through; background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn .tag { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.btn:hover .tag { color: var(--lantern-ink); }
.btn.main { background: var(--ink); color: var(--bg); justify-content: center; text-align: center; }
.btn.main:hover { background: var(--lantern); color: var(--lantern-ink); }
.note { font-size: 16px; color: var(--bad); font-weight: 600; }

.dicebox { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; padding: 8px 0; }
.die { width: 92px; height: 92px; border-radius: 22px; border: 3px solid var(--ink); background: var(--surface); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 52px; }
.die.rolling { animation: wob .35s linear infinite; }
@keyframes wob { 0% { transform: rotate(-8deg) } 50% { transform: rotate(8deg) } 100% { transform: rotate(-8deg) } }
@media (prefers-reduced-motion: reduce) { .die.rolling { animation: none } }
.sum { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.sum.win { color: var(--good); } .sum.lose { color: var(--bad); }
.feather { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.feather input { width: 22px; height: 22px; accent-color: var(--lantern); }

.field { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 440px) { .field { grid-template-columns: 1fr; } }
.field input { width: 100%; border: 2px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
.field input:focus { border-color: var(--sky); outline: none; }
label.lab { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--muted); }
.stats span { border: 1.5px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.end { text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 40px; color: var(--lantern); letter-spacing: .02em; }

.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { border: 2px solid var(--line); border-radius: 14px; background: var(--bg); padding: 4px 12px 4px 6px; display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 600; font-size: 15px; cursor: pointer; min-height: 44px; }
.tab[aria-pressed="true"] { border-color: var(--ink); background: var(--lantern); color: var(--lantern-ink); }
.tab.add { padding-left: 14px; color: var(--muted); border-style: dashed; }
.builder { display: grid; grid-template-columns: 164px minmax(0, 1fr); gap: 16px; }
.mini .srow { gap: 4px; font-size: 12px; }
.mini .srow .sn { width: 80px; white-space: nowrap; }
.mini .pip { width: 10px; height: 10px; }
@media (max-width: 480px) { .builder { grid-template-columns: 1fr; } }
.prev { display: flex; flex-direction: column; gap: 8px; align-items: center; background: var(--bg); border-radius: 16px; padding: 8px; align-self: start; }
.sw { font-family: var(--font-display); font-weight: 800; color: var(--muted); line-height: 1; }
.opts { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grp { display: flex; flex-direction: column; gap: 6px; }
.gl { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-display); font-weight: 600; font-size: 14px; border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 12px; min-height: 36px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.chip.rm { color: var(--bad); }
.sw { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--surface); }
.heroes { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.heroes figure { margin: 0; text-align: center; }
.heroes figcaption { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
.nm-in { width: 100%; border: 2px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
.nm-in:focus { border-color: var(--sky); outline: none; }

.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.w { border-radius: 4px; transition: background .15s; }
.w.on { background: var(--lantern); color: var(--lantern-ink); box-shadow: 0 0 0 3px var(--lantern); }
.big .story { font-size: 24px; line-height: 1.7; }
.big .btn { font-size: 21px; }
.crow { display: flex; gap: 8px; }
.crow .btn { flex: 1; min-width: 0; }
.spk { flex: 0 0 52px; width: 52px; min-height: 52px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); cursor: pointer; display: grid; place-items: center; padding: 0; }
.spk:hover { border-color: var(--ink); }
.spk svg { width: 24px; height: 24px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.vnote { font-size: 14px; color: var(--muted); }

.hcard { display: flex; gap: 10px; align-items: center; border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; background: var(--bg); }
.hcard:has(input:checked) { border-color: var(--ink); box-shadow: 0 0 0 2px var(--lantern); }
.hcard > input { width: 22px; height: 22px; accent-color: var(--lantern); flex: none; }
.hcard .hi { min-width: 0; flex: 1; display: flex; gap: 10px; align-items: center; cursor: pointer; }
.hcard .hx { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.hcard .hn { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.2; overflow-wrap: anywhere; }
.srow { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 13px; }
.srow .sn { width: 96px; color: var(--muted); }
.pips { display: flex; gap: 3px; }
.pip { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: inline-block; }
.pip.on { background: var(--lantern); box-shadow: 0 0 0 1.5px var(--lantern-ink) inset; }
.srow.big { font-size: 16px; padding: 8px 0; border-bottom: 1px dotted var(--line); }
.srow.big .sn { flex: 1; width: auto; color: var(--ink); min-width: 0; }
.srow.big small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); font-family: var(--font-body); }
.step { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--ink); background: var(--surface); font-family: var(--font-display); font-weight: 800; font-size: 22px; cursor: pointer; padding: 0; line-height: 1; }
.step[disabled] { opacity: .35; border-color: var(--line); cursor: default; }
.badge { font-family: var(--font-display); font-weight: 800; font-size: 13px; background: var(--lantern); color: var(--lantern-ink); border-radius: 999px; padding: 2px 10px; align-self: flex-start; }
.pts { font-family: var(--font-display); font-weight: 800; font-size: 17px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rew { background: var(--bg); border: 2px dashed var(--lantern); border-radius: 14px; padding: 10px 14px; font-size: 16px; }
.mini { display: flex; flex-direction: column; gap: 3px; width: 100%; }
.btn.locked, .btn[disabled].locked { text-decoration: none; opacity: .7; border-style: dashed; border-color: var(--muted); }
.btn .tag.lk { white-space: normal; text-align: right; max-width: 46%; font-size: 12px; }
.namebox { display: flex; flex-direction: column; gap: 8px; border: 2px dashed var(--lantern); border-radius: 14px; padding: 12px 14px; background: var(--bg); }
.gdot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; box-shadow: 0 0 8px currentColor; border: 2px solid var(--ink); }
.magibar { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--font-display); font-weight: 600; font-size: 13px; }
.mg { border: 1.5px solid var(--lantern); border-radius: 999px; padding: 2px 10px; background: var(--bg); }
.mg.used { opacity: .5; border-color: var(--line); }
.btn.magic, .btn.magic[disabled] { border-style: dashed; border-color: var(--lantern); }
.hcard .mgl { font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--muted); }
.foot { font-size: 14px; color: var(--muted); text-align: center; }
.foot a { color: var(--sky); font-weight: 600; display: inline-block; padding: 8px 6px; }
.btn.max, .btn[disabled].max { border-color: var(--lantern); box-shadow: inset 0 0 0 2px var(--lantern); }
.lvl { font-family: var(--font-display); font-weight: 800; font-size: 13px; color: var(--lantern-ink); background: var(--lantern); border-radius: 999px; padding: 1px 10px; }
.rew.up { border-style: solid; }
.wlist { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
/* Heltebilledet følger med, mens man vælger */
.pvtag { font-family: var(--font-display); font-weight: 800; font-size: 12px; background: var(--berry); color: #fff; border-radius: 999px; padding: 1px 9px; margin-left: 8px; vertical-align: middle; }
.prev { position: sticky; top: 8px; z-index: 3; }
.prev svg { max-width: 100%; height: auto; }
/* Topbjælken: navnet og tandhjulet på forsiden; "‹ Forside" alle andre steder, hvor navnet stod. */
.bar .barl { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.bar .barl .pvtag { margin-left: 0; }
.tilbage { font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 16px 6px 12px; min-height: 44px; cursor: pointer; }
.tilbage:hover, .gear:hover { border-color: var(--ink); }
.gear { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; margin-left: auto; }
.gear svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* Spørgsmålet før man forlader en historie (og før skovens venner nulstilles): på siden selv, med to knapper. */
.spoerg { display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 2px dashed var(--lantern); border-radius: 20px; padding: 16px 18px; }
.spoerg p { font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.3; }
.to-knapper { display: flex; flex-wrap: wrap; gap: 10px; }
.to-knapper .btn { flex: 1 1 200px; justify-content: center; text-align: center; }

/* Forsiden: heltene øverst og så Lanternestien. Én lanterne pr. historie i zigzag ned ad en prikket sti;
   en tændt lanterne kan spilles, en slukket er et kommende kapitel. Stien er det ene dristige greb på siden. */
#stage.home, #stage.ledsager { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.helte-tekst { font-size: 15px; color: var(--muted); }
.helte2 { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: flex-start; }
.helt { display: grid; justify-items: center; gap: 2px; width: 70px; background: none; border: 0; padding: 4px 0; cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 14px; line-height: 1.2; color: var(--ink); }
.helt .ring { width: 62px; height: 62px; border-radius: 50%; border: 3px solid var(--lantern); box-shadow: 0 0 12px color-mix(in srgb, var(--lantern) 45%, transparent); overflow: hidden; display: grid; place-items: center; background: var(--surface); transition: opacity .15s, border-color .15s; }
.helt .ring svg { width: 58px; height: 58px; display: block; }
.helt .hn { max-width: 70px; overflow-wrap: anywhere; text-align: center; }
.helt.fra .ring { border-color: var(--line); box-shadow: none; }
.helt.fra .ring svg { opacity: .45; filter: saturate(.6); }
.helt.fra .hn { color: var(--muted); }
.helt.ny .ring { border: 2px dashed var(--muted); box-shadow: none; background: none; font-size: 30px; font-weight: 600; color: var(--muted); }
.helt.ny .hn { color: var(--muted); }
.helt.ny:only-child { width: auto; }
.helt.ny:only-child .hn { max-width: 140px; }
.helt:hover .ring { border-color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .helt .ring { transition: none; } }
#helt-besked { margin-top: -4px; }
.gruppe { display: flex; flex-direction: column; gap: 4px; margin-top: 16px; }
.gruppe > h2 { font-size: 24px; font-weight: 800; }
.gruppe > h2 span { display: block; font-family: var(--font-body); font-weight: 400; font-size: 15px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.sti2 { position: relative; display: grid; }
.sti2 > svg.vej { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; overflow: visible; pointer-events: none; }
.st { position: relative; z-index: 1; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; align-items: center; padding: 9px 0; min-height: 86px; background: none; border: 0; font: inherit; color: inherit; text-align: left; width: 100%; }
button.st { cursor: pointer; border-radius: 16px; }
.st.h { grid-template-columns: minmax(0, 1fr) 58px; text-align: right; }
.st.h .lys2 { order: 2; }
.lys2 { width: 58px; height: 68px; display: block; }
.st .tx { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.st.h .tx { align-items: flex-end; }
.st .tx b, .st .tx small { background: var(--bg); box-shadow: 0 0 0 5px var(--bg); border-radius: 4px; max-width: 100%; }
.st .tx b { font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1.2; text-wrap: balance; }
.st .tx small { color: var(--muted); font-size: 14px; line-height: 1.3; }
.st.nu .tx small { color: var(--good); font-weight: 600; }
.st.slukket .tx b { color: var(--muted); font-weight: 600; }
button.st:hover .tx b { text-decoration: underline; text-decoration-color: var(--lantern); text-decoration-thickness: 3px; text-underline-offset: 4px; }
.tom { color: var(--muted); }

/* Arket, der glider op nedefra, når man trykker på en lanterne. */
#ark-bag { position: fixed; inset: 0; z-index: 20; }
#ark-dim { position: absolute; inset: 0; background: rgba(16, 28, 25, .5); }
.ark { position: absolute; left: 0; right: 0; bottom: 0; max-width: 640px; margin-inline: auto; max-height: calc(100% - 24px); overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: 0 -6px 24px rgba(0, 0, 0, .2); padding-bottom: env(safe-area-inset-bottom, 0px); animation: op .22s ease-out; }
@keyframes op { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ark { animation: none; } }
.ark .greb { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 6px; }
.ark .scene-art { margin: 0; border-radius: 0; }
.ark .scene-art svg { max-height: 34vh; }
.ark .ak { padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
.ark-sted { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--muted); line-height: 1.3; }
.ark h2 { font-size: 28px; font-weight: 800; }
.ark p.blurb { font-size: 17px; }
.btn.lys { background: var(--lantern); color: var(--lantern-ink); border-color: var(--lantern); justify-content: center; text-align: center; font-weight: 800; }
.btn.lys:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.lys[disabled] { text-decoration: none; background: var(--surface); color: var(--muted); border-color: var(--line); opacity: 1; }
.luk { align-self: center; background: none; border: 0; padding: 8px 16px; min-height: 44px; cursor: pointer; font-family: var(--font-body); font-size: 16px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.luk:hover { color: var(--ink); }

/* Vælg følgesvend: historien øverst, så seks kort i to kolonner. */
.valgt-hist { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: center; }
.valgt-hist .mini { border-radius: 10px; overflow: hidden; width: 72px; height: 45px; }
.valgt-hist .mini svg { width: 100%; height: 100%; display: block; }
.valgt-hist small { display: block; font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--muted); line-height: 1.3; }
.valgt-hist b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.2; }
.ledsager h2 { font-size: 24px; font-weight: 800; margin-top: 8px; }
.sv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sv button { display: flex; flex-direction: column; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 16px; overflow: hidden; padding: 0; font: inherit; color: var(--ink); cursor: pointer; }
.sv button svg { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; }
.sv button[aria-pressed="true"] { border-color: var(--lantern); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lantern) 40%, transparent); }
.sv button:hover { border-color: var(--ink); }
.sv button[aria-pressed="true"]:hover { border-color: var(--lantern); }
.sv .t { padding: 7px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
.sv b { font-family: var(--font-display); font-weight: 800; font-size: 16px; line-height: 1.15; }
.sv small { color: var(--muted); font-size: 13px; line-height: 1.3; }
.sv .plus { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--good); margin-top: 2px; }
#afsted { margin-top: 6px; }

/* Topbjælken sidder fast øverst, når den har "‹ Forside", så man altid kan komme ud af en lang scene.
   Spørgsmålet "Vil I stoppe historien her?" står lige under den. */
.topp { display: flex; flex-direction: column; gap: 10px; }
.topp.fast { position: sticky; top: 0; z-index: 10; background: var(--bg); margin-inline: -16px; padding: 8px 16px; margin-block: -8px; }
.bar { flex-wrap: nowrap; }
#barr { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#epi-kort { display: none; }
@media (max-width: 560px) {
  #epi { display: none; }
  #epi-kort { display: inline; }
}

/* Indstillinger: én række pr. valg; en kontakt, der lyser som en lanterne, når den er slået til. */
.indst { display: flex; flex-direction: column; }
.indst-row { display: flex; flex-direction: column; gap: 4px; padding: 12px 0; border-bottom: 1px dotted var(--line); }
.indst-row:last-child { border-bottom: 0; padding-bottom: 0; }
.indst-row .vnote { font-size: 15px; }
.indst-row .btn { align-self: stretch; }
.skift { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: none; border: 0; padding: 4px 0; min-height: 48px; cursor: pointer; text-align: left; font-family: var(--font-display); font-weight: 600; font-size: 19px; }
.kontakt { flex: none; width: 54px; height: 32px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; }
.kontakt::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
.skift[aria-pressed="true"] .kontakt { background: var(--lantern); box-shadow: 0 0 10px var(--lantern); }
.skift[aria-pressed="true"] .kontakt::after { transform: translateX(22px); }
@media (prefers-reduced-motion: reduce) { .kontakt, .kontakt::after { transition: none; } }
.btn.farlig { border-color: var(--berry); color: var(--berry); }
.btn.farlig:hover { background: var(--berry); color: var(--surface); border-color: var(--berry); }
@media (max-width: 480px) {
  .prev { top: 0; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 8px 12px; border: 1px solid var(--line); box-shadow: 0 4px 10px rgba(0, 0, 0, .12); }
  .prev svg { width: 64px; flex: none; }
  .prev .mini { display: none; }
}
</style>
</head>

<!-- Arket med historien, når man trykker på en tændt lanterne (fyldes af aabnArk). -->
<div id="ark-bag" hidden>
  <div id="ark-dim"></div>
  <div class="ark" id="ark" role="dialog" aria-modal="true" aria-labelledby="ark-titel"></div>
</div>

<script src="js/katalog.js"></script>
<script src="js/data.js"></script>
<script src="js/kit.js"></script>
<script src="art/dele.js"></script>
<script src="stories/katalog.js"></script>
<script>
(function () {
  var D = LK.data;
  var COMPS = D.comps, MAGICS = D.magics, STATS = D.stats, FRIEND_FLAGS = D.friendFlags;
  /* Historierne registrerer sig med LK.addStory (se LK.start nederst). STORIES har samme rækkefølge som kataloget:
     sagaens dele og derefter de synlige månedshistorier. ENTRY er katalogets post for hver historie (type, udgives). */
  var STORIES = [], ENTRY = {};
  var MAANEDER = ['januar', 'februar', 'marts', 'april', 'maj', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'december'];
  function storyById(id) { return STORIES.filter(function (x) { return x.id === id; })[0] || null; }
  function erMaaned(id) { return !!ENTRY[id] && ENTRY[id].type === 'maaned'; }
  function sagaDele() { return STORIES.filter(function (x) { return !erMaaned(x.id); }); }
  function sagaIndex(id) { return sagaDele().map(function (x) { return x.id; }).indexOf(id); }
  function nextStory(id) { var i = sagaIndex(id); return i < 0 ? null : sagaDele()[i + 1] || null; }
  function storyStart(id) { return storyById(id).start; }
  /* Et kapitel i en serie (ENTRY med serie): næste kapitel fra hele kataloget, også et, der ikke er udgivet endnu. */
  function naesteKapitel(id) { return ENTRY[id] && ENTRY[id].serie ? LK.naesteKapitel(LK.katalogPoster || [], ENTRY[id]) : null; }
  /* Slutskærmen for et kapitel: er næste kapitel udgivet (og hentet), kan man spille det; ellers siges, hvornår det kommer.
     Efter sidste kapitel kommer en ny serie næste måned. */
  function kapitelSlut(id) {
    if (!ENTRY[id] || !ENTRY[id].serie) return { knap: null, tekst: '' };
    var n = naesteKapitel(id);
    if (!n) return { knap: null, tekst: 'Næste måned kommer en ny serie.' };
    if (storyById(n.id)) return { knap: storyById(n.id), tekst: '' };
    if (!LK.erUdgivet(n, new Date())) return { knap: null, tekst: 'Næste kapitel kommer fredag den ' + dagTekst(n.udgives) + '.' };
    return { knap: null, tekst: '' }; /* udgivet, mens appen stod åben; det kommer på listen */
  }
  /* 'ÅÅÅÅ-MM-DD' -> 'december 2026' */
  function maanedTekst(dato) { var d = String(dato || '').split('-'); return (MAANEDER[+d[1] - 1] || '') + ' ' + d[0]; }
  /* 'ÅÅÅÅ-MM-DD' -> '11. december' */
  function dagTekst(dato) { var d = String(dato || '').split('-'); return (+d[2]) + '. ' + (MAANEDER[+d[1] - 1] || ''); }
  function overskrift(id) {
    var e = ENTRY[id];
    if (erMaaned(id) && e.serie) return 'Ugens eventyr · ' + e.serie.titel + ' · kapitel ' + e.kapitel + ' af ' + e.kapitler;
    if (erMaaned(id)) return 'Månedens eventyr · ' + maanedTekst(e.udgives);
    return 'Del ' + (sagaIndex(id) + 1) + ' af ' + sagaDele().length;
  }

  /* ?preview=<id> spiller én historie uanset dato med et eksempelhold. Så gemmes der intet på enheden:
     al brug af localStorage går gennem store, som ikke skriver i forhåndsvisningen. */
  var PARAMS = new URLSearchParams(location.search);
  var PREVIEW_ID = PARAMS.get('preview') || null;
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { if (PREVIEW_ID) return; try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var state;
  var kit = LK.lavKit(function () { return state; });
  var esc = kit.esc, gen = kit.gen, joinNames = kit.joinNames, friendNames = kit.friendNames, gnistNames = kit.gnistNames;
  /* Levels (udkast): et level hvert LEVEL_EVERY. gennemførte eventyr. Ekstra magi fra SECOND_MAGIC_LEVEL. */
  var LEVEL_EVERY = 2, SECOND_MAGIC_LEVEL = 3;
  function heroLevel(h) { return 1 + Math.floor(((h && h.stories) || 0) / LEVEL_EVERY); }
  function storiesToLevel(h, L) { return Math.max(0, (L - 1) * LEVEL_EVERY - ((h && h.stories) || 0)); }
  function magicById(id) { return MAGICS.filter(function (m) { return m.id === id; })[0] || null; }
  function magicOf(h) { return magicById(h.magic); }
  function heroMagics(h) {
    var a = [], m1 = magicOf(h), m2 = (heroLevel(h) >= SECOND_MAGIC_LEVEL && h.magic2 && h.magic2 !== h.magic) ? magicById(h.magic2) : null;
    if (m1) a.push(m1); if (m2) a.push(m2); return a;
  }
  function magicUses(h, m) { return m ? 1 + ((h.stats && h.stats[m.stat] >= 3) ? 1 : 0) : 0; }
  function magicLeft(h, m) { return magicUses(h, m) - (state.magicUsed[h.id + ':' + m.id] || 0); }
  function useMagic(h, m) { var k = h.id + ':' + m.id; state.magicUsed[k] = (state.magicUsed[k] || 0) + 1; }
  var MAGIC_NOTE = {
    gnist: function (n) { return n + ' skabte en lille ny gnist med sin gnistmagi.'; },
    dyr: function (n) { return n + ' talte dyrenes sprog, og de hjalp gerne.'; },
    syn: function (n) { return n + ' så det skjulte med sit magiske syn.'; },
    latter: function (n) { return n + ' strøede latterstøv, og pludselig fik alle lyst til at grine.'; }
  };
  function shieldHero() {
    for (var i = 0; i < state.players.length; i++) {
      var p = state.players[i], ms = heroMagics(p);
      for (var j = 0; j < ms.length; j++) if (ms[j].id === 'skjold' && magicLeft(p, ms[j]) > 0) return { h: p, m: ms[j] };
    }
    return null;
  }
  function magicChoices(id) {
    var tbl = MAGIC_OPTS[id], out = [];
    if (!tbl) return out;
    state.players.forEach(function (h) {
      heroMagics(h).forEach(function (m) {
        var o = tbl[m.id];
        if (!o || magicLeft(h, m) <= 0 || (o.show && !o.show())) return;
        out.push({ label: esc(h.name) + ': ' + o.l, to: o.to, mag: h, mobj: m, opt: o });
      });
    });
    return out;
  }
  function magiBar() {
    var out = [];
    state.players.forEach(function (h) {
      heroMagics(h).forEach(function (m) {
        var left = magicLeft(h, m);
        out.push('<span class="mg' + (left <= 0 ? ' used' : '') + '"><b>' + esc(h.name) + '</b> ' + m.name + ' ' + left + '/' + magicUses(h, m) + '</span>');
      });
    });
    return out.length ? '<div class="magibar">✨ ' + out.join('') + '</div>' : '';
  }
  /* Følgesvendens små bemærkninger: ved start, ved udfordringer (hver anden), når det går galt, og til sidst. */
  var COMP_VOICE = {
    raev: {
      intro: 'Rikke Ræv strækker sig og smiler lusket. &laquo;Jeg følger bare med. Jeg har næse for eventyr,&raquo; siger hun.',
      challenge: ['Rikke Ræv kniber øjnene sammen. &laquo;Her skal man være lidt kvik,&raquo; hvisker hun.', 'Rikke Ræv kigger sig omkring med spidse ører. &laquo;Der er altid en lille genvej,&raquo; mumler hun.'],
      fail: ['Rikke Ræv ryster sig og griner. &laquo;Det var bare en prøve. Vi finder en anden vej.&raquo;', 'Rikke Ræv blinker til jer. &laquo;Selv ræve snubler. Prøv igen.&raquo;'],
      end: 'Rikke Ræv smiler fra øre til øre. &laquo;Det var næsten for nemt,&raquo; siger hun og blinker.'
    },
    bjorn: {
      intro: 'Bastian Bjørn brummer glad og går ved siden af jer. &laquo;Bare bliv tæt ved mig,&raquo; siger han. &laquo;Så går det nok.&raquo;',
      challenge: ['Bastian Bjørn spænder sine store skuldre. &laquo;Jeg er her, hvis I får brug for mig,&raquo; brummer han.', 'Bastian Bjørn stiller sig tæt på jer. &laquo;Tag det i jeres eget tempo,&raquo; siger han roligt.'],
      fail: ['Bastian Bjørn klapper jer let på skulderen. &laquo;Det er helt i orden. Vi prøver igen.&raquo;', 'Bastian Bjørn brummer blidt. &laquo;Selv bjørne falder over rødder. Op med jer!&raquo;'],
      end: 'Bastian Bjørn løfter armene og brummer så højt, at fuglene letter. &laquo;Det var en god dag,&raquo; siger han.'
    },
    pind: {
      intro: 'Pip Pindsvin går tæt ved jeres fødder. &laquo;Jeg er lidt lille, men jeg lytter godt,&raquo; siger hun stille.',
      challenge: ['Pip Pindsvin lytter med hovedet på skrå. &laquo;Hvad siger jeres mavefornemmelse?&raquo; spørger hun blidt.', 'Pip Pindsvin kryber lidt tættere på. &laquo;Tag jer god tid,&raquo; hvisker hun.'],
      fail: ['Pip Pindsvin lægger en bitte lille hånd på jeres arm. &laquo;Det går nok. Vi gør det sammen.&raquo;', 'Pip Pindsvin smiler forsigtigt. &laquo;Det var godt prøvet. Det tæller.&raquo;'],
      end: 'Pip Pindsvin smiler med hele ansigtet. &laquo;Tak, fordi I lyttede til hinanden,&raquo; siger hun.'
    },
    lysorm: {
      intro: 'Lulle Lysorm lyser svagt ved jeres side. &laquo;Jeg tror, det her bliver et fantastisk eventyr,&raquo; siger hun drømmende.',
      challenge: ['Lulle Lysorm lyser lidt kraftigere. &laquo;Hvad hvis man bare forestillede sig, at det var nemt?&raquo; spørger hun.', 'Lulle Lysorm svæver rundt om jer. &laquo;Jeg kan se en idé gemme sig derovre,&raquo; hvisker hun.'],
      fail: ['Lulle Lysorm blinker roligt i mørket. &laquo;Det var kun begyndelsen på en bedre idé,&raquo; siger hun.', 'Lulle Lysorm lyser blidt. &laquo;Jeg drømte lige om en ny måde. Vil I høre?&raquo;'],
      end: 'Lulle Lysorm lyser som en lille måne. &laquo;Det var lige som i min drøm,&raquo; sukker hun glad.'
    },
    krage: {
      intro: 'Krage Krølle lander på jeres skulder. &laquo;Hvorfor tog hønen over vejen?&raquo; spørger han. &laquo;Fordi den ville med på eventyr!&raquo;',
      challenge: ['Krage Krølle rømmer sig højt. &laquo;Nu ville det være et godt tidspunkt for en vittighed,&raquo; siger han.', 'Krage Krølle knipser med vingen. &laquo;Hold nu lige hovedet koldt, nu kommer det svære,&raquo; mumler han.'],
      fail: ['Krage Krølle kraxer et lille grin. &laquo;Det var sjovt, men ikke helt rigtigt! Prøv igen!&raquo;', 'Krage Krølle ryster fjerene. &laquo;Hvis det ikke lykkes, så lav i det mindste en sjov lyd.&raquo;'],
      end: 'Krage Krølle flyver tre sløjfer i luften. &laquo;Hvilket eventyr!&raquo; kraxer han. &laquo;Det skal jeg fortælle til alle!&raquo;'
    },
    mus: {
      intro: 'Mille Mus kigger op fra en lille lup. &laquo;Jeg skal bare lige se, hvad der gemmer sig,&raquo; siger hun.',
      challenge: ['Mille Mus snuser i en krog. &laquo;Hov, hvad er det der?&raquo; hvisker hun nysgerrigt.', 'Mille Mus kigger under en sten. &laquo;Der er ALTID noget at opdage,&raquo; siger hun.'],
      fail: ['Mille Mus kigger op med store øjne. &laquo;Vi har bare ikke set alt endnu,&raquo; siger hun.', 'Mille Mus piber glad. &laquo;Når noget ikke virker, er der noget nyt at opdage.&raquo;'],
      end: 'Mille Mus tegner en lille streg i sin notesbog. &laquo;Jeg skrev det hele ned,&raquo; siger hun stolt.'
    }
  };
  function compRemark(id, sc) {
    var v = COMP_VOICE[state.comp];
    if (!v) return '';
    function one(a) { return Array.isArray(a) ? a[state.turn % a.length] : a; }
    if (sc.end) return one(v.end);
    if (STORIES.some(function (s) { return s.start === id; })) return one(v.intro);
    if (/(Fejl|Hint)$/.test(id)) return one(v.fail);
    var ch = sc.dyn ? sc.dyn() : (sc.choices || []);
    if (ch.some(function (c) { return c.roll || c.bevaeg; })) { state.compCount = (state.compCount || 0) + 1; return state.compCount % 2 === 1 ? one(v.challenge) : ''; }
    return '';
  }
  function fresh(keep) {
    state = { players: keep ? keep.players : [], comp: keep ? keep.comp : null, compName: '', compStat: '',
      valgt: false, visited: [], gnists: 0, feather: false, featherUsed: false, turn: 0, rolls: 0, bevaegelser: 0, wrong: {}, scene: null, awarded: false, flags: {}, remembered: [], story: (keep && keep.story) || 'lantern', gnistList: [], usedG: {}, lastUse: '',
      gnisterIn: ((lib && lib.world && lib.world.gnistNavne) || []).slice(0, 4), magicUsed: {}, magicNote: '', maxUsed: {}, mester: null };
    var wd = (lib && lib.world) || {};
    FRIEND_FLAGS.forEach(function (k) { if (wd[k]) state.flags[k] = true; });
    state.remembered = friendNames(wd);
    if (state.comp) { var c = COMPS.filter(function (x) { return x.id === state.comp; })[0]; state.compStat = c.stat; state.compName = c.name; }
  }
  fresh();

  var $ = function (id) { return document.getElementById(id); };

  /* Billederne bevæger sig med CSS fra art/dele.js; den sættes ind én gang. */
  if (LK.art) { var artCss = document.createElement('style'); artCss.textContent = LK.art.css; document.head.appendChild(artCss); }
  /* Lanternerækken under scenens billede: seks lanterner, n af dem tændt. */
  function lampsHtml(n) {
    var o = '';
    for (var i = 0; i < 6; i++) o += '<i class="' + (i < n ? 'on' : '') + '"></i>';
    return '<div class="lamps" aria-hidden="true">' + o + '</div>';
  }
  /* Scenens billede fra historiens billeder. Fejler et billede, vises scenen bare uden. */
  function artHtml(id) {
    if (!ART[id] || !LK.art) return '';
    try { return '<figure class="scene-art">' + LK.art.scene(ART[id]) + '</figure>'; } catch (e) { console.error('Billedet til ' + id + ' kunne ikke tegnes:', e); return ''; }
  }
  function setSpark() {
    $('spark').innerHTML = [0, 1, 2, 3].map(function (i) { return '<i class="' + (state.gnists > i ? 'on' : '') + '"></i>'; }).join('');

  var SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';

  /* Scener, magi- og mester-valg fyldes fra de registrerede historier. Scene-id'er er unikke på tværs af historierne,

  var S = {}, MAGIC_OPTS = {}, MAX_OPTS = {}, ART = {};

    if (dobbelt.length) throw new Error('Scene-id findes allerede: ' + dobbelt.join(', '));

  LK.addStory = function (factory) {

  var stage = $('stage');

  var view = '';

  /* "‹ Forside": midt i en historie spørges der først (på siden selv, så terning og valg står urørt bagved);

  function tilForside() {

      if (lib.heroes.length) setup.view = 'lib';

  var MDR = ['jan.', 'feb.', 'mar.', 'apr.', 'maj', 'jun.', 'jul.', 'aug.', 'sep.', 'okt.', 'nov.', 'dec.'];
  var UGEDAGE = ['søndag', 'mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag', 'lørdag'];
  /* 'ÅÅÅÅ-MM-DD' -> 'fredag 13. nov.' (ugedagen regnes på kalenderdatoen alene, så tidszonen ikke flytter den) */
  function kortDato(dato) {

    return UGEDAGE[new Date(Date.UTC(d[0], d[1] - 1, d[2])).getUTCDay()] + ' ' + d[2] + '. ' + (MDR[d[1] - 1] || '');
  }
  function foersteStort(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  /* Hvor historien hører til: "Kapitel n af N i <serie>", "Del n af 4" eller "Månedens eventyr fra <måned år>". */
  function stedTekst(id) {
    var e = ENTRY[id] || {};
    if (e.serie) return 'Kapitel ' + e.kapitel + ' af ' + e.kapitler + ' i ' + e.serie.titel;
    if (erMaaned(id)) return 'Månedens eventyr fra ' + maanedTekst(e.udgives);
    return 'Del ' + (sagaIndex(id) + 1) + ' af ' + sagaDele().length;
  }
  /* Den korte udgave af scenens overskrift til telefoner. */
  function kortOverskrift(id) {
    var e = ENTRY[id];

    if (erMaaned(id)) return foersteStort(maanedTekst(e.udgives));

  /* Titlerne på de kommende kapitler i de synlige serier (hentes med historierne, men registreres ikke; se hentHistorier). */
  var KOMMENDE = {}, VENTER = {};
  /* Lanternestiens grupper: de synlige serier (nyeste først) med alle deres kapitler, også de kommende,
     så månedshistorier uden serie og til sidst Den store fortælling. Hvert stop: { id, nr, titel, linje, kommer, nu }. */
  function stiGrupper() {
    var serier = {}, liste = [], enkelte = [], katalog = LK.katalogPoster || [];
    function stop(st, nr) {
      var done = !!lib.world['done_' + st.id];
      return { id: st.id, nr: nr, titel: st.title, linje: done ? 'Gennemført' : 'Ude nu', nu: !done };
    }
    STORIES.forEach(function (st) {
      var e = ENTRY[st.id];
      if (!erMaaned(st.id)) return;
      if (!e.serie) { enkelte.push(stop(st, 0)); return; }
      var g = serier[e.serie.id];
      if (!g) { g = serier[e.serie.id] = { id: e.serie.id, titel: e.serie.titel, linje: '', nyeste: '', stop: [] }; liste.push(g); }
      if (e.udgives > g.nyeste) g.nyeste = e.udgives;
    });
    liste.forEach(function (g) {
      var kap = katalog.filter(function (p) { return p.serie && p.serie.id === g.id; }).sort(function (a, b) { return a.kapitel - b.kapitel; });
      g.linje = 'En lanterne tændes hver fredag i ' + (MAANEDER[+String(kap[0].udgives).split('-')[1] - 1] || '');
      kap.forEach(function (p) {
        var st = ENTRY[p.id] ? storyById(p.id) : null;
        if (st) { g.stop.push(stop(st, p.kapitel)); return; }
        if (ENTRY[p.id]) return; /* udgivet, men kunne ikke hentes */
        g.stop.push({ id: p.id, nr: p.kapitel, titel: KOMMENDE[p.id] ? KOMMENDE[p.id].title : 'Kapitel ' + p.kapitel, linje: 'Tændes ' + kortDato(p.udgives), kommer: true });
      });
    });
    liste.sort(function (a, b) { return a.nyeste < b.nyeste ? 1 : a.nyeste > b.nyeste ? -1 : 0; });

  /* Den prikkede, buede linje mellem lanternerne i en gruppe. Tegnes efter lanternernes rigtige placering,

  var stiObs = null;

    var r = sti.getBoundingClientRect(), pkt = [].map.call(sti.querySelectorAll('.lys2'), function (l) {
      var b = l.getBoundingClientRect();

  function renderSettings() {

  function awardHtml() {
    if (!state.players.length) return '';
    var m = monthIdx(), got = [], had = [];
    if (!state.awarded) {
      state.awarded = true;
      state.players.forEach(function (p) {
        var lv0 = heroLevel(p);
        p.stories = (p.stories || 0) + 1;
        if (heroLevel(p) > lv0) state.levelNow = (state.levelNow || []).concat({ n: p.name, lv: heroLevel(p) });
        /* 1 point efter hvert gennemført eventyr (ikke længere begrænset til én gang pr. måned) */
        p.pts = (p.pts || 0) + 1; p.bonusMonth = m; got.push(p.name); state.gotNow = (state.gotNow || []).concat(p.name);
      });
      /* En månedshistorie står for sig selv: den gemmer kun, at den er spillet, og ændrer ikke sagaens venner og gnister. */

  function enter(id) {
    var sc = S[id];

  function render() {
    var id = state.scene, sc = S[id];
    stopSpeak();
    setSpark(); setView('scene');
    var lit = sc.all ? 6 : sc.lit != null ? sc.lit : 1 + state.gnists * 2 + (state.visited.length > 0 ? 1 : 0);
    var paras = typeof sc.text === 'function' ? sc.text() : sc.text;
    if (state.magicNote) { paras = [state.magicNote].concat(paras); state.magicNote = ''; }
    if (state.compNote) paras = paras.concat([state.compNote]);
    var choices = sc.dyn ? sc.dyn() : (sc.choices || (sc.next ? [{ label: 'Læs videre', to: sc.next, main: true }] : []));
    if (!sc.end) choices = choices.concat(magicChoices(id), maxChoices(id));

      delete o.bevaeg;

    });
    var isChoice = choices.length > 1;
    var askTxt = typeof sc.ask === 'function' ? sc.ask() : sc.ask;

        (ks.tekst ? '<p class="note" id="naestekap">' + ks.tekst + '</p>' : '') +
        '<div class="choices"><button class="btn main" id="again" type="button">Læs eventyret igen</button>' + (ks.knap ? '<button class="btn" id="nextchapter" type="button">Spil næste kapitel</button>' : '') + (erMaaned(state.story) ? '<button class="btn" id="back" type="button">Tilbage til historierne</button>' : nextStory(state.story) ? '<button class="btn" id="nextstory" type="button">Spil næste del: ' + nextStory(state.story).title + '</button>' : '') + '<button class="btn" id="team" type="button">Forbedre helte</button></div>';
    } else {
      h += magiBar() + '<p class="note" id="wrongnote" hidden></p><div class="choices" id="choices"></div>';
    }
    stage.innerHTML = h;
    bindTools(choices, !!sc.end);
    if (gi) $('gn').oninput = function () { gi.name = this.value; };
    saetEpi(overskrift(state.story), kortOverskrift(state.story));
    /* Til scenens top, med topbjælken ("‹ Forside") lige over den. */

      $('again').onclick = function () { var st = state.story; fresh({ players: state.players, comp: state.comp, story: st }); enter(storyStart(st)); };

      if ($('back')) $('back').onclick = function () { tilForside(); };
      return;
    }
    var box = $('choices');
    choices.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn' + (c.main ? ' main' : '') + (c.mag ? ' magic' : '') + (c.maxStat ? ' max' : '');
      var wr = state.wrong[c.key], lk = c.lock ? c.lock() : null;
      b.innerHTML = '<span>' + c.label + '</span>' + (lk ? '<span class="tag lk">' + lk + '</span>' : c.mag ? '<span class="tag">✨ Magi</span>' : c.maxStat ? '<span class="tag">⭐ Mester</span>' : c.roll ? '<span class="tag">🎲 ' + c.roll.stat + '</span>' : c.bevaeg ? '<span class="tag">🤸</span>' : '');
      if (wr || lk) b.disabled = true;
      if (lk) b.classList.add('locked');
      b.onclick = function () {
        state.valgt = true; /* et valg er truffet: "‹ Forside" spørger nu først */
        if (c.mag) {
          useMagic(c.mag, c.mobj); if (c.opt.eff) c.opt.eff(c.mag);
          state.magicNote = MAGIC_NOTE[c.mobj.id](c.mag.name);
          state.turn++; enter(c.to); return;
        }
        if (c.maxStat) {
          state.maxUsed[c.maxStat] = true;
          if (c.maxOpt.eff) c.maxOpt.eff(c.maxHero, c.maxStat);
          if (c.maxOpt.n) state.magicNote = c.maxOpt.n(esc(c.maxHero.name));
          state.turn++; enter(c.to); return;
        }
        if (c.roll) { if (c.key) state.wrong[c.key] = true; return startRoll(c); }
        if (c.bevaeg) { if (c.key) state.wrong[c.key] = true; return startMove(c); }
        if (c.wrong) { state.wrong[c.key] = true; b.disabled = true; var n = $('wrongnote'); n.innerHTML = c.wrong; n.hidden = false; return; }
        if (c.use) { state.usedG[c.use] = true; state.lastUse = c.use; }
        state.turn++;
        enter(c.to);
      };
      var row = document.createElement('div'); row.className = 'crow'; row.appendChild(b);
      if (speech.ok && !c.main && !lk) {
        var sk = document.createElement('button'); sk.type = 'button'; sk.className = 'spk'; sk.setAttribute('aria-label', 'Læs muligheden højt'); sk.innerHTML = SPK;
        sk.onclick = function () { speak(plain(c.label), false); };
        row.appendChild(sk);
      }
      box.appendChild(row);
    });
  }

  function startRoll(c) {
    var r = c.roll;
    var who = state.players[state.turn % state.players.length] || { name: 'I', stats: {}, acc: '' };
    var base = (who.stats && who.stats[r.stat]) || 0;
    var cb = state.compStat === r.stat ? 1 : 0;
    var acc = accStat(who.acc) === r.stat ? 1 : 0;
    var fb = r.flag && state.flags[r.flag] ? 1 : 0;
    var val = base + cb + acc + fb;
    var ok = 0; for (var q = 1; q <= 6; q++) if (q + val >= r.target) ok++;
    var pct = Math.round(ok / 6 * 100);
    var lvl = pct >= 83 ? 'Nemt' : pct >= 50 ? 'Middel' : pct > 0 ? 'Svært' : 'Meget svært';
    var canFeather = state.feather && !state.featherUsed;
    var box = $('choices');
    box.innerHTML = '<div class="dicebox">' +
      '<div class="sum">Slå mindst ' + r.target + ' i alt.<br>' + esc(gen(who.name)) + ' ' + r.stat + ': ' + base + (cb ? ' + 1 fra ' + esc(state.compName) : '') + (acc ? ' + 1 fra ' + accName(who.acc).toLowerCase() : '') + (fb ? ' + 1 ' + r.flagTxt : '') + '<br>' + lvl + ' (' + pct + ' % chance)</div>' +
      '<div class="die" id="die" aria-live="polite">?</div>' +
      (canFeather ? '<label class="feather"><input type="checkbox" id="fe"> Brug Uffes fjer (+1)</label>' : '') +
      '<div class="sum" id="res"></div>' +
      '<button class="btn main" id="roll" type="button" style="width:100%">Slå terningen</button></div>';
    var rollOnce = function () {
      var die = $('die'), btn = $('roll');
      var old = $('shield'); if (old) old.remove();
      btn.disabled = true;
      var fe = canFeather && !state.featherUsed && $('fe').checked;
      if (canFeather) $('fe').disabled = true;
      die.classList.add('rolling');
      var t = setInterval(function () { die.textContent = 1 + Math.floor(Math.random() * 6); }, 70);
      setTimeout(function () {
        clearInterval(t);
        die.classList.remove('rolling');
        var d = 1 + Math.floor(Math.random() * 6);
        die.textContent = d;
        state.rolls++;
        if (fe) state.featherUsed = true;
        var total = d + val + (fe ? 1 : 0);
        var win = total >= r.target;
        var res = $('res');
        res.className = 'sum ' + (win ? 'win' : 'lose');
        res.textContent = d + ' + ' + val + (fe ? ' + 1' : '') + ' = ' + total + (win ? '. Det lykkes!' : '. Det lykkedes ikke denne gang.');
        btn.disabled = false;
        btn.textContent = 'Læs videre';
        if (prefs.auto) speak(res.textContent, false);
        btn.onclick = function () { state.turn++; enter(win ? r.win : r.lose); };
        var sh = win ? null : shieldHero();
        if (sh) {
          var sb = document.createElement('button');
          sb.type = 'button'; sb.id = 'shield'; sb.className = 'btn magic'; sb.style.width = '100%';
          sb.textContent = 'Brug ' + gen(sh.h.name) + ' Lysskjold: slå igen';
          btn.parentNode.insertBefore(sb, btn);
          sb.onclick = function () { useMagic(sh.h, sh.m); sb.remove(); res.textContent = ''; res.className = 'sum'; btn.textContent = 'Slå terningen'; btn.onclick = rollOnce; rollOnce(); };
        }
      }, 900);
    };
    $('roll').onclick = rollOnce;
  }

  /* Bevægelsesudfordring: familien gør instruktionen og afgør selv, hvordan det gik. Samme udfald og tur som et kast,
     men den tæller som en bevægelse, ikke et terningkast, og hverken fjer eller Lysskjold bruges. */
  function startMove(c) {
    var bv = c.bevaeg;
    var who = state.players[state.turn % state.players.length] || { name: 'I' };
    var box = $('choices');
    box.innerHTML = '<div class="dicebox bevaeg">' +
      '<div class="sum">' + bv.goer + '</div>' +
      '<div class="sum">' + esc(who.name) + ' prøver, og alle må gerne være med</div>' +
      '<button class="btn main" id="klarede" type="button" style="width:100%">Vi klarede det!</button>' +
      '<button class="btn" id="vaklede" type="button" style="width:100%">Vi vaklede</button></div>';
    function videre(to) { return function () { state.bevaegelser++; state.turn++; enter(to); }; }
    $('klarede').onclick = videre(bv.win);
    $('vaklede').onclick = videre(bv.lose);
    stopSpeak();
    speech.text = plain(bv.goer); speech.choiceText = '';
    if (prefs.auto) speak(speech.text, false);
  }

  /* Forhåndsvisningens eksempelhold: Asta og Bo med 2 i hvert træk og Bastian Bjørn. Gemmes aldrig. */
  function startPreview() {
    $('pvtag').hidden = false;
    prefs.bevaeg = true; /* forhåndsvisningen viser altid bevægelserne, og gemmer ikke (se savePrefs) */
    var st = storyById(PREVIEW_ID);
    var helte = ['Asta', 'Bo'].map(function (navn, i) {
      var h = makeHero(i);
      h.id = 'eksempel' + (i + 1); h.name = navn; h.pts = 0;
      STATS.forEach(function (t) { h.stats[t[0]] = 2; });
      return h;
    });
    lib = { heroes: helte, play: { eksempel1: true, eksempel2: true }, world: {} };
    setup.view = 'lib'; setup.edit = null; setup.isNew = false; setup.comp = 'bjorn';
    if (!st) {
      setView('setup');
      saetEpi('Forhåndsvisning');
      stage.innerHTML = '<h2>Historien findes ikke</h2><p>Forhåndsvisningen kunne ikke finde historien &laquo;' + esc(PREVIEW_ID) + '&raquo;.</p><button class="btn main" id="tilliste" type="button">Til historierne</button>';
      $('tilliste').onclick = function () { renderHome(); };
      return;
    }
    setup.story = st.id;
    fresh({ players: helte, comp: 'bjorn', story: st.id });
    enter(st.start);
  }

  /* ?katalog=<sti> er kun til testene: et andet katalog, fx tests/fixtures/stories-maaned/katalog.js.
     Det virker kun på testmaskinen (localhost, 127.0.0.1 og file:), aldrig fra den rigtige adresse. */
  function hentKatalog(videre) {
    var sti = PARAMS.get('katalog');
    var lokalt = location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (!sti || !lokalt || !/^[A-Za-z0-9_\-\/]+\.js$/.test(sti) || sti.charAt(0) === '/') return videre();
    var el = document.createElement('script');
    el.src = sti;
    el.onload = el.onerror = function (e) { if (e.type === 'error') console.error('Kunne ikke hente kataloget ' + sti); videre(); };
    document.head.appendChild(el);
  }

  /* Læs kataloget, hent de synlige historier som <script>, og start appen, når alle er hentet eller fejlet. */
  LK.start = function () { hentKatalog(function () { hentHistorier(vis); }); };
  function vis() {
    if (PREVIEW_ID) startPreview();
    else if (welcomed) renderHome(); else renderWelcome(false);
  }
  var hentetDato = null, henter = false; /* datoen, listen sidst blev lavet for, og om den er ved at blive lavet */
  function hentHistorier(videre) {
    henter = true;
    var nu = new Date(), alle = LK.katalogPoster || [];
    var poster = LK.synlige(alle, nu, PREVIEW_ID);
    var nye = poster.filter(function (p) { return !ENTRY[p.id]; });
    nye.forEach(function (p) { ENTRY[p.id] = p; });
    /* De kommende kapitler i de synlige serier hentes med, så deres titler kan stå ved de slukkede lanterner. */
    var synligeSerier = poster.filter(function (p) { return p.serie; }).map(function (p) { return p.serie.id; });
    var kommende = PREVIEW_ID ? [] : alle.filter(function (p) {
      return p.serie && !ENTRY[p.id] && !VENTER[p.id] && synligeSerier.indexOf(p.serie.id) >= 0;
    });
    kommende.forEach(function (p) { VENTER[p.id] = true; });
    var hent = nye.concat(kommende), mangler = hent.length;
    /* Alle katalogets filer, også de kommende historier, gemmes af service workeren (se nederst og sw.js),
       så en kommende historie også åbner på sin udgivelsesdag uden net. De registreres og vises ikke før. */
    if (!PREVIEW_ID) {
      LK.offlineFiler = alle.map(function (p) { return new URL(p.fil, location.href).href; });
      if (LK.gemOffline) LK.gemOffline();
    }
    function klar() {
      var orden = poster.map(function (p) { return p.id; });
      function plads(id) { var i = orden.indexOf(id); return i < 0 ? orden.length : i; }
      STORIES.sort(function (a, b) { return plads(a.id) - plads(b.id); });
      hentetDato = LK.datoStreng(nu); henter = false;
      videre();
    }
    if (!mangler) return klar();
    hent.forEach(function (p) {
      var el = document.createElement('script');
      el.src = p.fil;
      el.async = false;
      el.onload = el.onerror = function (e) {
        if (e.type === 'error') console.error('Kunne ikke hente historien ' + p.fil);
        if (--mangler === 0) klar();
      };
      document.head.appendChild(el);
    });
  }
  /* En installeret app kan ligge åben i flere dage. Vågner den på en ny dato (fx den 1.), hentes de historier,
     der er udkommet siden. Forsiden og listen tegnes kun igen, hvis de står fremme; en historie, I er i gang med, afbrydes ikke. */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || PREVIEW_ID || henter || !hentetDato || LK.datoStreng(new Date()) === hentetDato) return;
    hentHistorier(function () {
      if (view === 'home') renderHome();
    });
  });
})();
LK.start();
</script>

<script>
/* App-delen: installation og brug uden internet */
(function () {
  /* "Installér app" står i indstillingerne, når browseren tilbyder det (LK.naarInstallerbar viser og skjuler den). */
  var evt = null;
  function opdater() { if (LK.naarInstallerbar) LK.naarInstallerbar(); }
  LK.kanInstallere = function () { return !!evt; };
  LK.installer = function () { if (!evt) return; evt.prompt(); evt.userChoice.finally(function () { evt = null; opdater(); }); };
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); evt = e; opdater(); });
  window.addEventListener('appinstalled', function () { evt = null; opdater(); });
  /* Forhåndsvisningen (?preview=) bruger ingen service worker, så et rettet udkast altid vises friskt. */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !new URLSearchParams(location.search).get('preview')) {
    window.addEventListener('load', function () {
      var sw = navigator.serviceWorker;
      /* Bed service workeren gemme katalogets filer (LK.offlineFiler, se hentHistorier). Det virker også ved
         første besøg, hvor siden endnu ikke går gennem service workeren, og igen, når en ny udgave tager over. */
      function gem() { sw.ready.then(function (reg) { if (reg.active && LK.offlineFiler) reg.active.postMessage({ gem: LK.offlineFiler }); }); }
      sw.register('sw.js').then(function () { LK.gemOffline = gem; gem(); }).catch(function () {});
      sw.addEventListener('controllerchange', gem);
    });
  }
})();
</script>
