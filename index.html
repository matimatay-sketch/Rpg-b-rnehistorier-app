<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lanterneskoven</title>
<meta name="description" content="Interaktiv fortælling for børn på 6-9 år, hvor familien læser, vælger og slår med terning sammen.">
<meta name="theme-color" content="#fbf5e9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141b26" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lanterneskoven">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf5e9; --bg2:#f3e8d2; --card:#fffdf8; --ink:#2d2a3e; --ink2:#615b73; --line:#e6d9bf;
  --accent:#e0791f; --accent-ink:#fff; --accent-soft:#fde3c4; --forest:#2f6b4f; --forest-soft:#dcefe3;
  --gold:#c99a2e; --gold-soft:#fbefc8; --magic:#6a4fc4; --magic-soft:#ebe4fb; --bad:#b4453f;
  --shadow:0 2px 0 rgba(60,40,10,.08), 0 8px 24px rgba(60,40,10,.08);
  --head:"Grandstander", ui-rounded, "Comic Sans MS", system-ui, sans-serif;
  --body:"Literata", Georgia, "Times New Roman", serif;
  --fs:1.12rem;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141b26; --bg2:#1a2331; --card:#1f2a3a; --ink:#f1ead8; --ink2:#b9b3a3; --line:#2f3b4f;
    --accent:#f4a547; --accent-ink:#1b1408; --accent-soft:#3d2d17; --forest:#7cc79e; --forest-soft:#1e3a2c;
    --gold:#f2c14e; --gold-soft:#3a3018; --magic:#b5a0ff; --magic-soft:#2c2547; --bad:#f08a80;
    --shadow:0 2px 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141b26; --bg2:#1a2331; --card:#1f2a3a; --ink:#f1ead8; --ink2:#b9b3a3; --line:#2f3b4f;
  --accent:#f4a547; --accent-ink:#1b1408; --accent-soft:#3d2d17; --forest:#7cc79e; --forest-soft:#1e3a2c;
  --gold:#f2c14e; --gold-soft:#3a3018; --magic:#b5a0ff; --magic-soft:#2c2547; --bad:#f08a80;
  --shadow:0 2px 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.6;
  min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.big{--fs:1.38rem}
h1,h2,h3,button,.btn,.label,.chip,nav{font-family:var(--head)}
h1{font-size:2rem;line-height:1.15;margin:.2em 0 .3em}
h2{font-size:1.55rem;line-height:1.2;margin:.2em 0 .5em}
h3{font-size:1.15rem;margin:.6em 0 .3em}
p{margin:0 0 .8em}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 48px}
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:860px;margin:0 auto}
.bar .title{flex:1;font-family:var(--head);font-weight:700;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button,.btn{font-size:1rem;font-weight:700;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--bg2);color:var(--ink);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);transition:transform .08s ease, filter .15s;text-decoration:none;display:inline-flex;align-items:center;gap:.4em;justify-content:center;line-height:1.2}
button:hover{filter:brightness(1.04)} button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.5;cursor:not-allowed}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:transparent;box-shadow:none;border:2px solid var(--line)}
.icon{padding:.55em .7em;min-width:44px;min-height:44px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--ink2)}
.small{font-size:.9em}
.center{text-align:center}
.grid{display:grid;gap:14px}
.hero-list{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.hero-card{display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;gap:4px;padding:14px;font-family:var(--head)}
.hero-card svg{width:120px;height:150px}
.hero-card .nm{font-weight:800;font-size:1.15rem}
.new-card{border:3px dashed var(--line);background:transparent;box-shadow:none;min-height:220px;font-size:1.1rem;color:var(--ink2)}
.logo{display:flex;align-items:center;gap:12px;margin:8px 0 4px}
.logo svg{width:56px;height:56px;flex:none}
.hint{background:var(--gold-soft);border-radius:14px;padding:12px 14px;margin:12px 0}
/* builder */
.builder{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.preview{position:sticky;top:12px;text-align:center}
.preview svg{width:100%;max-width:240px;height:auto}
@media (max-width:680px){.builder{grid-template-columns:1fr}.preview{position:static}.preview svg{max-width:170px}}
.opt-group{margin:0 0 14px}
.opt-group .label{font-weight:700;margin-bottom:6px;display:block}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:.5em .8em;border-radius:12px;background:var(--bg2);font-weight:600;border:2px solid transparent;font-size:.95rem}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sw{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
input[type=text]{font:inherit;font-family:var(--head);font-size:1.2rem;padding:.55em .8em;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:340px}
input[type=text]:focus{outline:3px solid var(--accent);border-color:transparent}
.steps{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
.steps span{font-family:var(--head);font-size:.85rem;padding:.25em .7em;border-radius:99px;background:var(--bg2);color:var(--ink2)}
.steps span.on{background:var(--accent);color:var(--accent-ink)}
.trait{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.trait:last-child{border-bottom:0}
.trait .tn{font-family:var(--head);font-weight:700}
.trait .td{font-size:.85em;color:var(--ink2);line-height:1.3}
.pips{display:flex;gap:4px;margin-top:4px}
.pips i{width:18px;height:18px;border-radius:6px;background:var(--bg2);border:2px solid var(--line)}
.pips i.f{background:var(--accent);border-color:var(--accent)}
.pips i.m{background:var(--gold);border-color:var(--gold)}
.pm{display:flex;gap:6px}
.pm button{width:44px;height:44px;padding:0;font-size:1.3rem;border-radius:12px}
.pick{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.pick button{flex-direction:column;align-items:flex-start;text-align:left;padding:14px;background:var(--card);border:2px solid var(--line);font-weight:600;gap:2px}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick .em{font-size:1.8rem;line-height:1}
.pick .d{font-family:var(--body);font-weight:400;font-size:.88rem;color:var(--ink2)}
/* hero page */
.hero-top{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.hero-top svg{width:100%;max-width:200px}
@media (max-width:600px){.hero-top{grid-template-columns:1fr;text-align:center}.hero-top svg{max-width:160px}.hero-top .row{justify-content:center}}
.chip{display:inline-flex;align-items:center;gap:.3em;padding:.25em .7em;border-radius:99px;background:var(--bg2);font-size:.9rem;font-weight:600}
.chip.gold{background:var(--gold-soft)} .chip.magic{background:var(--magic-soft)} .chip.forest{background:var(--forest-soft)}
.stories{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.story{display:flex;flex-direction:column;gap:6px;text-align:left;align-items:stretch;background:var(--card);border:2px solid var(--line);padding:16px;border-radius:18px;font-weight:600}
.story .num{font-size:.8rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.story .st{font-size:1.2rem;font-weight:800}
.story .bl{font-family:var(--body);font-weight:400;font-size:.92rem;color:var(--ink2)}
.story.locked{opacity:.55}
.story.special{border-color:var(--accent);background:linear-gradient(160deg,var(--accent-soft),var(--card) 60%)}
.story .em{font-size:2rem}
/* play */
.scene{max-width:720px;margin:0 auto}
.art{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:3.1rem;margin:6px auto 8px;
  background:radial-gradient(circle,var(--gold-soft) 0%,var(--bg2) 70%);box-shadow:0 0 40px var(--gold-soft)}
.scene h2{text-align:center}
.text{font-size:var(--fs)}
.text .w.hl{background:var(--gold-soft);border-radius:4px;box-shadow:0 0 0 2px var(--gold-soft)}
.buddy{display:flex;gap:10px;align-items:flex-start;background:var(--forest-soft);border-radius:16px;padding:10px 14px;margin:14px 0;font-size:.95em}
.buddy .em{font-size:1.8rem;line-height:1}
.question{font-family:var(--head);font-weight:700;font-size:1.2em;margin:20px 0 10px;color:var(--accent)}
.choices{display:grid;gap:10px}
.choice{justify-content:space-between;text-align:left;background:var(--card);border:2px solid var(--line);padding:14px 16px;font-size:1.02em;flex-wrap:wrap;gap:6px 10px}
.choice:hover{border-color:var(--accent)}
.choice .tag{font-size:.8rem;font-weight:600;padding:.2em .6em;border-radius:99px;background:var(--bg2);white-space:nowrap}
.choice.master{border-color:var(--gold);background:linear-gradient(120deg,var(--gold-soft),var(--card) 70%)}
.choice.master .tag{background:var(--gold);color:#2b1d00}
.choice.magic{border-color:var(--magic)} .choice.magic .tag{background:var(--magic-soft);color:var(--magic)}
.choice.friend .tag{background:var(--forest-soft)}
.choice.lockd{opacity:.5;cursor:not-allowed;border-style:dashed}
.statbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:24px 0 0}
.chance{display:flex;gap:5px;justify-content:center;margin:10px 0}
.chance i{width:22px;height:22px;border-radius:50%;background:var(--bg2);border:2px solid var(--line)}
.chance i.y{background:var(--forest);border-color:var(--forest)}
.diff{display:inline-block;padding:.15em .6em;border-radius:99px;font-family:var(--head);font-weight:700;font-size:.85rem}
.diff.nemt{background:var(--forest-soft)} .diff.middel{background:var(--gold-soft)} .diff.svaert{background:var(--accent-soft)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,15,10,.55);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s}
.modal .card{max-width:440px;width:100%;text-align:center;max-height:92vh;overflow:auto}
@keyframes fade{from{opacity:0}}
.die{width:110px;height:110px;margin:10px auto;display:block}
.die.spin{animation:wob .12s linear infinite}
@keyframes wob{0%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.06)}100%{transform:rotate(-8deg) scale(1)}}
.own{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}
.own button{padding:0;aspect-ratio:1;background:var(--card);border:2px solid var(--line)}
.own svg{width:100%;height:100%}
.result{font-family:var(--head);font-weight:800;font-size:1.5rem;margin:6px 0}
.result.ok{color:var(--forest)} .result.no{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7em 1.2em;border-radius:14px;font-family:var(--head);z-index:60;max-width:calc(100% - 32px);text-align:center;animation:fade .2s}
.end-stars{font-size:3rem;letter-spacing:.2em}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.switch{width:58px;height:34px;border-radius:99px;padding:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-pressed="true"]{background:var(--forest)} .switch[aria-pressed="true"]::after{left:28px}
#fatal{display:none}
#fatal.on{display:block}
.fade-in{animation:fade .3s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<noscript><div class="wrap"><div class="card"><h2>Lanterneskoven kræver JavaScript</h2><p>Slå JavaScript til i browseren for at spille.</p></div></div></noscript>
<div id="app" aria-live="polite"></div>
<div id="fatal" class="wrap">
  <div class="card">
    <h2>Ups, skoven kunne ikke vågne 🌙</h2>
    <p>Noget gik galt, da spillet skulle starte. Det skyldes oftest gamle gemte data i browseren.</p>
    <p class="muted small" id="fatal-msg"></p>
    <div class="row">
      <button class="primary" id="fatal-reset">Nulstil gemte data og prøv igen</button>
      <button id="fatal-reload">Prøv igen</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";

/* ============================================================
   Fejl-skærm: hvis noget går galt, kan de gemte data nulstilles
   ============================================================ */
let booted = false;
function fatal(err){
  try{ console.error(err); }catch(e){}
  if(booted) return; // efter start viser vi blot en lille besked
  const f = document.getElementById('fatal');
  document.getElementById('app').style.display='none';
  f.classList.add('on');
  document.getElementById('fatal-msg').textContent = (err && err.message) ? 'Fejl: '+err.message : '';
}
document.getElementById('fatal-reset').onclick = function(){
  try{ ['lk-heroes','lk-prefs','lk-welcomed'].forEach(k=>localStorage.removeItem(k)); }catch(e){}
  location.reload();
};
document.getElementById('fatal-reload').onclick = ()=>location.reload();
window.addEventListener('error', e=>{ if(!booted) fatal(e.error||new Error(e.message)); else toast('Hov, noget drillede. Prøv igen.'); });
window.addEventListener('unhandledrejection', e=>{ if(!booted) fatal(e.reason); });

/* ============================================================
   Data om spillet
   ============================================================ */
const TRAITS = [
  {k:'mod',          n:'Mod',          e:'🦁', d:'Tør prøve svære og lidt uhyggelige ting'},
  {k:'list',         n:'List',         e:'🦊', d:'Finder smarte veje og snedige planer'},
  {k:'venlighed',    n:'Venlighed',    e:'💛', d:'Får venner og trøster andre'},
  {k:'fantasi',      n:'Fantasi',      e:'🌈', d:'Finder på idéer, sange og lege'},
  {k:'humor',        n:'Humor',        e:'😄', d:'Får alle til at grine, selv grublere'},
  {k:'nysgerrighed', n:'Nysgerrighed', e:'🔍', d:'Opdager spor og løser gåder'}
];
const TR = Object.fromEntries(TRAITS.map(t=>[t.k,t]));

const MAGICS = {
  gnist:     {n:'Gnistmagi',   e:'✨', d:'Laver små lys og varme gnister i mørket.'},
  dyresprog: {n:'Dyresprog',   e:'🐾', d:'Kan tale med alle skovens dyr.'},
  syn:       {n:'Skjulte syn', e:'👁️', d:'Kan se det, der er gemt eller usynligt.'},
  latter:    {n:'Latterstøv',  e:'🌟', d:'Et drys, og alle må fnise.'},
  skjold:    {n:'Lysskjold',   e:'🛡️', d:'Et varmt skjold af lys, der passer på jer.'}
};

const COMPANIONS = {
  rasmus: {n:'Ræven Rasmus',         s:'Rasmus', e:'🦊', t:'list',
    lines:{start:['Jeg har en plan. Eller, jeg får en om lidt.','Hvis vi er snu, kan vi klare alt.'],
           glad:['Det var snedigt gjort!','Ha! Det kunne jeg ikke have gjort bedre selv. Næsten.'],
           spaending:['Hmm. Der er altid en smart vej, hvis man kigger godt efter.','Lad os tænke, før vi springer. Eller springe og tænke bagefter?'],
           uhygge:['Uhyggeligt? Pyt. Ræve er gode til mørke.','Bare hold jer tæt til min hale.'],
           slut:['Sikke et eventyr. Jeg siger det til alle ræve, jeg kender.']}},
  pjuske: {n:'Pindsvinet Pjuske',    s:'Pjuske', e:'🦔', t:'mod',
    lines:{start:['Jeg er lille, men jeg har pigge OG mod!','Fremad! Bare ikke for hurtigt, mine ben er korte.'],
           glad:['Hurra! Det var modigt!','Jeg rullede mig næsten sammen af glæde.'],
           spaending:['Vi kan godt. Én lille fod ad gangen.','Mod er bare at være bange og gøre det alligevel.'],
           uhygge:['Jeg ryster ikke. Det er bare mine pigge, der vinker.','Tag min pote. Eller, pas på piggene.'],
           slut:['I var så modige i dag. Det var jeg også. Lidt.']}},
  mira:   {n:'Musen Mira',           s:'Mira',   e:'🐭', t:'nysgerrighed',
    lines:{start:['Hvad mon der er bag næste træ? Og det næste? Og det næste?','Jeg har mine knurhår klar til at opdage ting.'],
           glad:['Se! Vi fandt ud af det!','Mine knurhår vidste det godt.'],
           spaending:['Kig godt efter, der er altid et spor.','Hvorfor, hvorfor, hvorfor? Det er mit yndlingsord.'],
           uhygge:['Pip! Nå, det var bare en skygge.','Mørke er bare et sted, vi ikke har kigget endnu.'],
           slut:['Jeg skal skrive alt det her ned i min lille musebog.']}},
  frode:  {n:'Frøen Frode',          s:'Frode',  e:'🐸', t:'humor',
    lines:{start:['Kvæk! Er vi der snart? Bare for sjov, vi er lige startet.','Jeg har pakket tre vittigheder og en flue.'],
           glad:['Kvæ-hæ-hæk! Det var godt!','Det fortjener et hop. HOP!'],
           spaending:['Hvis alt andet slår fejl, så lav en sjov lyd. Kvæk!','Ved I, hvad frøer siger, når de er spændte? Kvæææk.'],
           uhygge:['Uhyggeligt? Jeg er så grøn af skræk. Nå nej, jeg er altid grøn.','Når man griner, bliver mørket mindre.'],
           slut:['Det var det sjoveste eventyr, siden jeg lærte at hoppe.']}},
  hilde:  {n:'Hjorten Hilde',        s:'Hilde',  e:'🦌', t:'venlighed',
    lines:{start:['Husk at være søde ved alle, vi møder.','Skoven er fuld af venner, vi ikke har mødt endnu.'],
           glad:['Hvor var det sødt gjort.','Kan I mærke det? Skoven smiler.'],
           spaending:['Måske er den, vi møder, bare ked af det.','Et venligt ord kan åbne mange døre.'],
           uhygge:['Jeg er lige her. I er ikke alene.','Selv uhyggelige ting kan have brug for en ven.'],
           slut:['I har så store hjerter. Tak, fordi I tog mig med.']}},
  silke:  {n:'Sommerfuglen Silke',   s:'Silke',  e:'🦋', t:'fantasi',
    lines:{start:['Forestil jer, hvad vi kan opleve i dag!','Mine vinger kilder. Det betyder eventyr.'],
           glad:['Sikke en vidunderlig idé!','Det var magisk. Næsten som mig.'],
           spaending:['Hvis I lukker øjnene, kan I måske se svaret.','Der er altid en idé mere, gemt et sted.'],
           uhygge:['Jeg tænker på regnbuer, når det er mørkt.','Lad os forestille os, at mørket er et stort, blødt tæppe.'],
           slut:['Det her eventyr skal jeg drømme om i nat.']}}
};

const FRIENDS = {
  uffe:    {n:'Uffe uglen',        e:'🦉'},
  esther:  {n:'Egernet Esther',    e:'🐿️'},
  bastian: {n:'Bjørnen Bastian',   e:'🐻'},
  tue:     {n:'Mosetrolden Tue',   e:'🧌'},
  maane:   {n:'Månen',             e:'🌙'},
  vind:    {n:'Vinden',            e:'🌬️'},
  froer:   {n:'Frøkoret',          e:'🎶'},
  karla:   {n:'Kragen Karla',      e:'🐦‍⬛'},
  spog:    {n:'Lille Spøg',        e:'👻'},
  edderkop:{n:'Edderkopperne',     e:'🕸️'}
};

const DIFF = {
  nemt:   {n:'Nemt',   base:3},
  middel: {n:'Middel', base:4},
  svaert: {n:'Svært',  base:5}
};

/* ============================================================
   Historierne. Hver scene:
   t   titel        e   ikon        mood   stemning til følgesvend

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  const t = amt<0?0:255, p=Math.abs(amt);
  r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function star(cx,cy,r,fill){
  let p=''; for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2, rr=i%2?r*.45:r; p+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1);}
  return `<path d="${p}Z" fill="${fill}"/>`;
}

function fixHero(h){
  if(!h || typeof h!=='object' || !h.id) throw new Error('En gemt helt er ødelagt');
  const tr = {}; TRAITS.forEach(t=>tr[t.k]=clamp(+((h.traits||{})[t.k])||1,1,5));
  return Object.assign({name:'Helt', look:{}, magic:[], companion:null, adv:0, points:0, sparks:0, friends:[], done:{}, progress:null, pendingMagic:false}, h, {traits:tr,
    magic:Array.isArray(h.magic)?h.magic.filter(m=>MAGICS[m]):[], friends:Array.isArray(h.friends)?h.friends.filter(f=>FRIENDS[f]):[]});
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function andList(a){ return a.length<2 ? a.join('') : a.slice(0,-1).join(', ')+' og '+a[a.length-1]; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function level(h){ return 1 + Math.floor(h.adv/2); }
function pick(arr, seed){ let x=0; for(const c of seed) x=(x*31+c.charCodeAt(0))>>>0; return arr[x%arr.length]; }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
function heroById(id){ return heroes.find(h=>h.id===id); }
function fill(str, h){ const c = h.companion?COMPANIONS[h.companion].s:'jeres ven'; return str.replace(/\{navn\}/g, h.name).replace(/\{ven\}/g, c); }
function bonusFor(h, tr, magic){
  const v = h.traits[tr]||1; let b = v>=4?2 : v>=2?1 : 0; const parts=[];
  if(b) parts.push(`${TR[tr].n} ${v}: +${b}`);
  if(h.companion && COMPANIONS[h.companion].t===tr){ b+=1; parts.push(`${COMPANIONS[h.companion].s}: +1`); }
  return {b, parts};
}
// Nemt = 3+, Middel = 4+, Svært = 5+ uden bonus. Bonus trækker fra, men man skal altid mindst slå 2.
function needOf(h, roll){ const {b,parts}=bonusFor(h, roll.tr); return {tn:clamp(DIFF[roll.d].base - b, 2, 6), parts}; }
function storyUnlocked(h, st){ return !st.needs || h.done[st.needs]; }

const speech = {
  ok: 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined',
  voice:null, spans:[], map:[], active:false,
  pickVoice(){ if(!this.ok) return; const vs=speechSynthesis.getVoices(); this.voice = vs.find(v=>/^da(-|_|$)/i.test(v.lang)) || null; },
  stop(){ if(!this.ok) return; this.active=false; try{ speechSynthesis.cancel(); }catch(e){} this.clear(); updateReadBtn(); },
  clear(){ document.querySelectorAll('.w.hl').forEach(e=>e.classList.remove('hl')); },
  read(){
    if(!this.ok){ toast('Din browser kan ikke læse højt.'); return; }
    this.stop();
    const spans=[...document.querySelectorAll('.say .w')]; let str='', map=[];
    spans.forEach((sp,i)=>{ map.push(str.length); str += sp.textContent + (sp.dataset.br?'\n':' '); });
    if(!str.trim()) return;
    const u = new SpeechSynthesisUtterance(str);
    u.lang='da-DK'; if(this.voice) u.voice=this.voice; u.rate=prefs.rate||0.9;
    u.onboundary = e=>{ if(e.name && e.name!=='word') return; let i=0; while(i+1<map.length && map[i+1]<=e.charIndex) i++; this.clear(); spans[i] && spans[i].classList.add('hl'); };
    u.onend = u.onerror = ()=>{ this.active=false; this.clear(); updateReadBtn(); };
    this.active=true; updateReadBtn();
    speechSynthesis.speak(u);
  }
};
if(speech.ok){ speech.pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged', ()=>speech.pickVoice()); }catch(e){} }
function updateReadBtn(){ const b=document.getElementById('readbtn'); if(b){ b.textContent = speech.active?'⏹ Stop':'🔊 Læs højt'; b.setAttribute('aria-pressed', speech.active); } }
function words(text){
  // gør teksten til ord-spans, så oplæsningen kan fremhæve dem
  return text.split(/\n\s*\n/).map(p=>{
    const ws = p.trim().split(/\s+/);
    return '<p>'+ws.map((w,i)=>`<span class="w"${i===ws.length-1?' data-br="1"':''}>${esc(w)}</span>`).join(' ')+'</p>';
  }).join('');
}

  if(step===1){
    const og=(key,label,list)=>`<div class="opt-group"><span class="label">${label}</span><div class="opts">${list.map(([k,n])=>`<button class="opt" data-act="look" data-k="${key}" data-v="${k}" aria-pressed="${draft.look[key]===k}">${n}</button>`).join('')}</div></div>`;
    const sw=(key,label,cols)=>`<div class="opt-group"><span class="label">${label}</span><div class="opts">${cols.map((c,i)=>`<button class="sw" style="background:${c}" data-act="look" data-k="${key}" data-v="${i}" aria-pressed="${draft.look[key]===i}" aria-label="${label} ${i+1}"></button>`).join('')}</div></div>`;
    body = `<div class="builder">
      <div class="preview card" id="preview">${heroSVG(draft.look)}<div><button data-act="randomlook">🎲 Tilfældig</button></div></div>
      <div>
        <div class="opt-group"><label class="label" for="hname">Hvad hedder helten?</label><input id="hname" type="text" maxlength="24" value="${esc(draft.name)}" placeholder="Fx Ida den Modige" autocomplete="off"></div>
        ${sw('skin','Hudfarve',SKINS)}
        ${og('face','Ansigt',LOOK.face)}
        ${og('hair','Frisure',LOOK.hair)}
        ${sw('hairColor','Hårfarve',HAIRC)}
        ${og('hat','Hat',LOOK.hat)}
        ${og('outfit','Tøj',LOOK.outfit)}
        ${sw('outfitColor','Farve på tøjet',OUTC)}
        ${og('acc','Tilbehør',LOOK.acc)}
        ${og('item','Ting at have med',LOOK.item)}
        <div class="row" style="margin-top:16px"><button class="primary" data-act="step" data-s="2">Videre til kræfter →</button></div>
      </div></div>`;
  } else if(step===2){
    const left = draftPoints();
    body = `<div class="builder"><div class="preview card">${heroSVG(draft.look)}<div class="nm" style="font-family:var(--head);font-weight:800">${esc(draft.name)}</div></div>
      <div><p>Alle kræfter starter på 1. I har <b>6 point</b> at fordele. Ingen kraft kan være højere end 4 fra start, men efter hvert eventyr får helten et nyt point. Når en kraft når 5, åbner der sig ⭐ <b>Mester-valg</b> i historierne.</p>
      <div class="hint" style="font-family:var(--head);font-weight:700">Point tilbage: <span id="ptsleft">${left}</span></div>
      <div class="card">${TRAITS.map(t=>traitRow(draft.traits[t.k], t, 'dtrait', left>0 && draft.traits[t.k]<4, draft.traits[t.k]>1)).join('')}</div>
      <div class="row" style="margin-top:16px"><button data-act="step" data-s="1">← Udseende</button><button class="primary" data-act="step" data-s="3">Videre →</button></div>
      ${left>0?'<p class="muted small">I kan godt gå videre uden at bruge alle point. De gemmes til senere.</p>':''}
      </div></div>`;
  } else {
    body = `<h3>Vælg en magi</h3><div class="pick">${Object.entries(MAGICS).map(([k,m])=>`<button data-act="dmagic" data-v="${k}" aria-pressed="${draft.magic[0]===k}"><span class="em">${m.e}</span><span>${m.n}</span><span class="d">${m.d}</span></button>`).join('')}</div>
      <h3 style="margin-top:22px">Vælg en følgesvend</h3><p class="muted small">Følgesvenden giver +1 på terningen, når I bruger dens kraft, og siger lidt undervejs.</p>
      <div class="pick">${Object.entries(COMPANIONS).map(([k,c])=>`<button data-act="dcomp" data-v="${k}" aria-pressed="${draft.companion===k}"><span class="em">${c.e}</span><span>${c.n}</span><span class="d">+1 til ${TR[c.t].n}</span></button>`).join('')}</div>
      <div class="row" style="margin-top:20px"><button data-act="step" data-s="2">← Kræfter</button><button class="primary" data-act="finishhero">Færdig! Mød jeres helt ✨</button></div>`;
  }
  return head + body + '</div>';
};
function traitRow(v, t, act, canUp, canDown){
  return `<div class="trait"><span style="font-size:1.6rem">${t.e}</span><div><div class="tn">${t.n}</div><div class="td">${t.d}</div>
    <div class="pips">${[1,2,3,4,5].map(i=>`<i class="${i<=v?(i===5?'m':'f'):''}"></i>`).join('')}</div></div>
    <div class="pm">${act==='dtrait'?`<button data-act="${act}" data-k="${t.k}" data-d="-1" ${canDown?'':'disabled'} aria-label="Mindre ${t.n}">−</button>`:''}${canUp!==null?`<button class="primary" data-act="${act}" data-k="${t.k}" data-d="1" ${canUp?'':'disabled'} aria-label="Mere ${t.n}">+</button>`:''}</div></div>`;
}
function draftPoints(){ return 6 - TRAITS.reduce((a,t)=>a+draft.traits[t.k]-1,0); }
function randomLook(){
  const r=a=>a[Math.floor(Math.random()*a.length)];
  return {skin:Math.floor(Math.random()*SKINS.length), face:r(LOOK.face)[0], hair:r(LOOK.hair)[0], hairColor:Math.floor(Math.random()*HAIRC.length),
    hat:r(LOOK.hat)[0], outfit:r(LOOK.outfit)[0], outfitColor:Math.floor(Math.random()*OUTC.length), acc:r(LOOK.acc)[0], item:r(LOOK.item)[0]};
}

/* ---------- heltens side ---------- */
VIEWS.hero = (v)=>{
  const h = heroById(v.id); if(!h) return VIEWS.home();
  const lvl = level(h), next = 2 - (h.adv%2);
  const cur = h.progress && STORY[h.progress.story];
  return `<div class="bar"><button class="icon ghost" data-act="go" data-to="home" aria-label="Til forsiden">←</button><div class="title">${esc(h.name)}</div>
    <button class="icon ghost" data-act="go" data-to="settings" aria-label="Indstillinger">⚙️</button></div>
  <div class="wrap" style="padding-top:0">
    <div class="hero-top">
      <div>${heroSVG(h.look, h.name)}</div>
      <div>
        <h1 style="margin-top:0">${esc(h.name)}</h1>
        <div class="row" style="margin-bottom:10px">
          <span class="chip gold">⭐ Level ${lvl}</span>
          <span class="chip gold">✨ ${h.sparks} ${h.sparks===1?'gnist':'gnister'}</span>
          ${h.magic.map(m=>`<span class="chip magic">${MAGICS[m].e} ${MAGICS[m].n}</span>`).join('')}
          ${h.companion?`<span class="chip forest">${COMPANIONS[h.companion].e} ${COMPANIONS[h.companion].n}</span>`:''}
        </div>
        <p class="muted small">${h.adv} ${h.adv===1?'eventyr':'eventyr'} klaret. ${next===1?'Ét':'To'} eventyr mere til level ${lvl+1}.${lvl<3&&!h.pendingMagic?' På level 3 kan helten lære en ekstra magi.':''}</p>
        ${h.pendingMagic?`<div class="hint"><b>Level 3!</b> ${esc(h.name)} kan lære en ny magi. <button class="primary" data-act="go" data-to="magic" data-id="${h.id}">Vælg magi ✨</button></div>`:''}
        ${cur?`<div class="hint"><b>I er midt i »${cur.title}«.</b><div class="row" style="margin-top:8px"><button class="primary" data-act="continue" data-id="${h.id}">Fortsæt historien →</button></div></div>`:''}
      </div>
    </div>

    <h2 style="margin-top:24px">Eventyr</h2>
    <div class="grid stories">
      ${STORIES.map(st=>{
        const lock = !storyUnlocked(h, st), done = h.done[st.id];
        return `<button class="story ${lock?'locked':''} ${st.special?'special':''}" data-act="start" data-id="${h.id}" data-s="${st.id}" ${lock?'aria-disabled="true"':''}>
          <span class="em">${lock?'🔒':st.e}</span>
          <span class="num">${st.special?'Halloween-special':'Del '+st.part}${done?' · klaret ✓':''}</span>
          <span class="st">${st.title}</span>
          <span class="bl">${lock?'Klar »'+STORY[st.needs].title+'« først.':st.blurb}</span>
        </button>`;}).join('')}
    </div>

    <h2 style="margin-top:28px">Kræfter</h2>
    ${h.points>0?`<div class="hint"><b>${h.points} ${h.points===1?'nyt point':'nye point'}!</b> Tryk på + for at gøre en kraft stærkere.</div>`:''}
    <div class="card">${TRAITS.map(t=>traitRow(h.traits[t.k], t, 'htrait', h.points>0 ? h.traits[t.k]<5 : null, false)).join('')}</div>

    <h2 style="margin-top:28px">Skovens venner</h2>
    ${h.friends.length?`<div class="row">${h.friends.map(f=>`<span class="chip forest" style="font-size:1rem;padding:.4em .9em">${FRIENDS[f].e} ${FRIENDS[f].n}</span>`).join('')}</div>`:'<p class="muted">Ingen endnu. Dem møder I på eventyrene.</p>'}

    <div class="row" style="margin-top:32px">
      <button class="ghost" data-act="editlook" data-id="${h.id}">✏️ Skift udseende</button>
      <button class="ghost" data-act="delhero" data-id="${h.id}">🗑️ Slet helt</button>

VIEWS.magic = (v)=>{
  const h = heroById(v.id); if(!h) return VIEWS.home();
  return `<div class="bar"><button class="icon ghost" data-act="go" data-to="hero" data-id="${h.id}" aria-label="Tilbage">←</button><div class="title">Ny magi</div></div>
  <div class="wrap" style="padding-top:0"><h2>${esc(h.name)} er nået til level 3!</h2><p>Vælg en magi mere. Den kan bruges i alle eventyr fra nu af.</p>
  <div class="pick">${Object.entries(MAGICS).filter(([k])=>!h.magic.includes(k)).map(([k,m])=>`<button data-act="learnmagic" data-id="${h.id}" data-v="${k}"><span class="em">${m.e}</span><span>${m.n}</span><span class="d">${m.d}</span></button>`).join('')}</div></div>`;
};

/* ---------- spillet ---------- */
VIEWS.play = (v)=>{
  const h = heroById(v.id); if(!h || !h.progress) return VIEWS.hero(v);
  const st = STORY[h.progress.story], sc = S[h.progress.scene];
  if(!sc){ h.progress=null; saveHeroes(); return VIEWS.hero(v); }
  const text = fill(typeof sc.x==='function'?sc.x(h):sc.x, h);
  const comp = h.companion && COMPANIONS[h.companion];
  const line = comp ? pick(comp.lines[sc.mood]||comp.lines.spaending, sc.t+h.id) : '';
  let choices='';
  if(sc.end){
    choices = `<button class="choice primary" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent);justify-content:center" data-act="finish" data-id="${h.id}">Afslut eventyret ✨</button>`;
  } else {
    choices = choicesFor(h, sc).map((c,i)=>choiceBtn(h, c, i)).join('');
  }
  return `<div class="bar"><button class="icon ghost" data-act="go" data-to="hero" data-id="${h.id}" aria-label="Til helten">←</button>
    <div class="title">${st.e} ${st.title}</div>
    ${speech.ok?`<button id="readbtn" data-act="read" aria-pressed="false">🔊 Læs højt</button>`:''}
    <button class="icon ghost" data-act="bigtext" aria-label="Stor skrift" aria-pressed="${!!prefs.big}">Aa</button></div>
  <article class="wrap scene" style="padding-top:0">
    <div class="art" aria-hidden="true">${sc.e||'🌲'}</div>
    <h2 class="say">${words(sc.t)}</h2>
    <div class="text say">${words(text)}</div>
    ${comp?`<aside class="buddy"><span class="em">${comp.e}</span><div><b>${comp.s}:</b> ${esc(line)}</div></aside>`:''}
    ${sc.end?'':`<p class="question say">${words('❓ '+sc.q)}</p>`}
    <div class="choices">${choices}</div>
    <div class="statbar"><span class="chip gold">✨ ${h.sparks}</span><span class="chip forest">🤝 ${h.friends.length} ${h.friends.length===1?'ven':'venner'}</span><span class="chip">⭐ Level ${level(h)}</span></div>
  </article>`;
};
function choicesFor(h, sc){
  const list = sc.dyn ? sc.dyn(h) : sc.c;
  return list.filter(c=>{
    if(c.magic && !h.magic.includes(c.magic)) return false;
    if(c.friend && !has(h,c.friend)) return false;
    if(c.cost && h.sparks < c.cost) return false;
    if(c.need && h.sparks < c.need) return false;
    return true;
  });
}
function choiceBtn(h, c, i){
  let cls='choice', tag='', dis='';
  if(c.master){
    const ok = h.traits[c.master]>=5;
    cls += ' master' + (ok?'':' lockd');
    tag = ok ? `⭐ Mester-valg · ${TR[c.master].n}` : `⭐ Kræver ${TR[c.master].n} 5`;
    if(!ok) dis='disabled';
  } else if(c.magic){ cls+=' magic'; tag=`${MAGICS[c.magic].e} ${MAGICS[c.magic].n}`; }
  else if(c.friend){ cls+=' friend'; tag=`${FRIENDS[c.friend].e} ${FRIENDS[c.friend].n}`; }
  else if(c.cost){ cls+=' friend'; tag=`✨ Bruger ${c.cost} ${c.cost===1?'gnist':'gnister'}`; }
  else if(c.need){ cls+=' friend'; tag=`✨ ${c.need} gnister`; }
  else if(c.roll){ const {tn}=needOf(h,c.roll); tag=`🎲 ${TR[c.roll.tr].n} · ${DIFF[c.roll.d].n} · ${7-tn} ud af 6`; }
  return `<button class="${cls}" data-act="choose" data-i="${i}" ${dis}><span>${esc(fill(c.t,h))}</span>${tag?`<span class="tag">${tag}</span>`:''}</button>`;
}
function enterScene(h, id){
  const sc = S[id]; if(!sc) throw new Error('Scenen '+id+' findes ikke');
  h.progress.scene = id;
  if(sc.gain){
    const g = h.progress.gained;
    if(sc.gain.sparks){ h.sparks += sc.gain.sparks; g.sparks += sc.gain.sparks; }
    if(sc.gain.friend && !has(h, sc.gain.friend)){ h.friends.push(sc.gain.friend); g.friends.push(sc.gain.friend); }
  }
  saveHeroes();
  speech.stop(); render(); window.scrollTo(0,0);
  if(prefs.autoRead) setTimeout(()=>speech.read(), 250);
}

/* ---------- terningen ---------- */
function openRoll(h, c){
  const {tn, parts} = needOf(h, c.roll);
  pendingRoll = {h, c, tn};
  const n = 7-tn;
  const m = document.createElement('div'); m.className='modal'; m.id='modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="rolltitle">
    <h2 id="rolltitle" style="margin-bottom:.2em">Slå med terningen</h2>
    <p style="margin:.2em 0">${TR[c.roll.tr].e} <b>${TR[c.roll.tr].n}</b> · <span class="diff ${c.roll.d}">${DIFF[c.roll.d].n}</span></p>
    <div class="chance" aria-label="Chance ${n} ud af 6">${[1,2,3,4,5,6].map(i=>`<i class="${i>=tn?'y':''}"></i>`).join('')}</div>
    <p style="margin:.2em 0"><b>Slå ${tn} eller mere.</b> Chancen er ${n} ud af 6.</p>
    ${parts.length?`<p class="muted small">Hjælp fra: ${parts.join(' · ')}</p>`:'<p class="muted small">Ingen hjælp denne gang, men alt kan ske!</p>'}
    <div id="dieArea">
      ${prefs.ownDie
        ? `<p class="small">Slå med jeres egen terning, og tryk på det, I slog:</p><div class="own">${[1,2,3,4,5,6].map(i=>`<button data-act="own" data-v="${i}" aria-label="${i}">${dieSVG(i)}</button>`).join('')}</div>`
        : `<div class="die">${dieSVG(6)}</div><button class="primary" data-act="roll" autofocus>🎲 Slå!</button>`}
    </div>
    <p style="margin-top:14px"><button class="ghost small" data-act="cancelroll">Vælg noget andet</button></p>
  </div>`;
  m.addEventListener('click', onClick);
  document.body.appendChild(m);
  const f=m.querySelector('[autofocus]'); if(f) f.focus();
}
function closeModal(){ const m=document.getElementById('modal'); if(m) m.remove(); }
function doRoll(){
  const area = document.getElementById('dieArea'); if(!area) return;
  area.innerHTML = `<div class="die spin" id="dieFace">${dieSVG(1)}</div>`;
  let k=0; const final = 1+Math.floor(Math.random()*6);
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tick = setInterval(()=>{
    k++; const f=document.getElementById('dieFace'); if(!f){ clearInterval(tick); return; }
    f.innerHTML = dieSVG(1+Math.floor(Math.random()*6));
    if(k>=(reduce?1:9)){ clearInterval(tick); showResult(final); }
  }, 80);
}
function showResult(n){
  const r = pendingRoll; if(!r) return;
  const ok = n>=r.tn;
  const area = document.getElementById('dieArea');
  const comp = r.h.companion && COMPANIONS[r.h.companion];
  area.innerHTML = `<div class="die">${dieSVG(n, ok?'#e3f4e8':'#fdebd6')}</div>
    <div class="result ${ok?'ok':'no'}">${ok?'Det lykkedes! 🎉':'Ikke denne gang …'}</div>
    <p class="small">${ok?`I slog ${n}. Det var nok!`:`I slog ${n}. Men historien går videre på en anden måde.`}${!ok&&comp?` <br>${comp.e} ${comp.s}: »Pyt! Det bliver spændende alligevel.«`:''}</p>
    <button class="primary" data-act="afterroll" data-ok="${ok?1:0}" autofocus>Videre →</button>`;
  const cr = document.querySelector('[data-act="cancelroll"]'); if(cr) cr.parentNode.remove();
  const b = area.querySelector('button'); if(b) b.focus();
}

/* ---------- afslutning ---------- */

};

/* ============================================================
   Handlinger
   ============================================================ */
const ACT = {
  welcome(){ welcomed=true; store.set('lk-welcomed', true); go('home', null, true); },
  go(d){ go(d.to, d.id?{id:d.id}:null); },
  back(){ if(history.state && history.length>1) history.back(); else go('home'); },
  newhero(){ draft = {id:null, name:'', look:randomLook(), traits:Object.fromEntries(TRAITS.map(t=>[t.k,1])), magic:[], companion:null}; go('build',{step:1}); },
  editlook(d){ const h=heroById(d.id); draft={id:h.id, name:h.name, look:Object.assign({},h.look), traits:Object.assign({},h.traits), magic:h.magic.slice(), companion:h.companion, editOnly:true}; go('build',{step:1}); },
  look(d){ draft.look[d.k] = /Color$|^skin$/.test(d.k) ? +d.v : d.v; refreshBuilder(); },
  randomlook(){ draft.look = randomLook(); render(); },
  step(d){
    readName();
    if(+d.s>1 && !draft.name.trim()){ toast('Helten skal have et navn først 🙂'); const i=document.getElementById('hname'); if(i) i.focus(); return; }
    if(draft.editOnly && +d.s>1){ const h=heroById(draft.id); h.name=draft.name.trim(); h.look=draft.look; saveHeroes(); draft=null; go('hero',{id:h.id}, true); toast('Udseendet er gemt'); return; }
    go('build',{step:+d.s}, true);
  },
  dtrait(d){ const v=draft.traits[d.k]+(+d.d); if(v<1||v>4) return; if(+d.d>0 && draftPoints()<=0) return; draft.traits[d.k]=v; render(); },
  dmagic(d){ draft.magic=[d.v]; render(); },
  dcomp(d){ draft.companion=d.v; render(); },
  finishhero(){
    if(!draft.magic.length){ toast('Vælg en magi'); return; }
    if(!draft.companion){ toast('Vælg en følgesvend'); return; }
    const h = fixHero({id:uid(), name:draft.name.trim()||'Helt', look:draft.look, traits:draft.traits, magic:draft.magic, companion:draft.companion, points:draftPoints()});
    heroes.push(h); saveHeroes(); draft=null; go('hero',{id:h.id}, true);
  },
  htrait(d){ const h=heroById(view.id); if(!h||h.points<1||h.traits[d.k]>=5) return; h.traits[d.k]++; h.points--; saveHeroes(); render();
    if(h.traits[d.k]===5) toast(`⭐ ${TR[d.k].n} er på 5! Nu kan I tage Mester-valg.`); },
  learnmagic(d){ const h=heroById(d.id); if(!h.magic.includes(d.v)) h.magic.push(d.v); h.pendingMagic=false; saveHeroes(); go('hero',{id:h.id}, true); toast(`${MAGICS[d.v].e} ${h.name} kan nu ${MAGICS[d.v].n}!`); },
  delhero(d){ const h=heroById(d.id); if(!confirm(`Vil I slette ${h.name}? Det kan ikke fortrydes.`)) return; heroes=heroes.filter(x=>x.id!==d.id); saveHeroes(); go('home',null,true); },
  start(d){
    const h=heroById(d.id), st=STORY[d.s];
    if(!storyUnlocked(h,st)){ toast(`Klar »${STORY[st.needs].title}« først 🔒`); return; }
    if(h.progress && h.progress.story!==d.s && !confirm(`I er midt i »${STORY[h.progress.story].title}«. Vil I starte »${st.title}« i stedet?`)) return;
    if(h.progress && h.progress.story===d.s){ go('play',{id:h.id}); return; }
    h.progress = {story:d.s, scene:st.start, gained:{sparks:0, friends:[]}};
    saveHeroes(); go('play',{id:h.id});
    if(prefs.autoRead) setTimeout(()=>speech.read(), 250);
  },
  continue(d){ go('play',{id:d.id}); },
  choose(d){
    const h=heroById(view.id), sc=S[h.progress.scene], c=choicesFor(h, sc)[+d.i];
    if(!c) return;
    if(c.master && h.traits[c.master]<5) return;
    if(c.roll){ speech.stop(); openRoll(h, c); return; }
    if(c.cost){ h.sparks -= c.cost; h.progress.gained.sparks -= c.cost; toast(`✨ I gav ${c.cost} ${c.cost===1?'gnist':'gnister'} væk`); }
    enterScene(h, c.go);
  },
  roll(){ doRoll(); },
  own(d){ showResult(+d.v); },
  cancelroll(){ pendingRoll=null; closeModal(); },
  afterroll(d){ const r=pendingRoll; pendingRoll=null; closeModal(); if(r) enterScene(r.h, +d.ok ? r.c.roll.ok : r.c.roll.no); },
  finish(d){
    const h=heroById(d.id); const p=h.progress; if(!p) return;
    const before=level(h);
    h.adv++; h.points++; h.done[p.story]=(h.done[p.story]||0)+1;
    const lvlUp = level(h)>before;
    if(lvlUp && level(h)>=3 && h.magic.length<2) h.pendingMagic=true;
    const res={sparks:Math.max(0,p.gained.sparks), friends:p.gained.friends, lvlUp, story:p.story};
    h.progress=null; saveHeroes(); speech.stop();
    go('end',{id:h.id, res}, true);
  },
  read(){ if(speech.active) speech.stop(); else speech.read(); },
  bigtext(){ prefs.big=!prefs.big; savePrefs(); render(); },
  pref(d){ prefs[d.k]=!prefs[d.k]; savePrefs(); render(); },
  rate(d){ prefs.rate=+d.v; savePrefs(); render(); },
  theme(d){ prefs.theme=d.v; savePrefs(); render(); },
  install(){ if(!installEvt) return; installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; render(); }); },
  resetall(){ if(!confirm('Vil I slette alle helte, venner og indstillinger? Det kan ikke fortrydes.')) return;
    ['lk-heroes','lk-prefs','lk-welcomed'].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} }); location.reload(); }
};
function readName(){ const i=document.getElementById('hname'); if(i && draft) draft.name=i.value; }
function refreshBuilder(){
  readName();
  const p=document.getElementById('preview'); if(p) p.firstElementChild.outerHTML = heroSVG(draft.look);
  document.querySelectorAll('[data-act="look"]').forEach(b=>{ const k=b.dataset.k; const val=/Color$|^skin$/.test(k)?+b.dataset.v:b.dataset.v; b.setAttribute('aria-pressed', draft.look[k]===val); });
}
function onClick(e){
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  e.preventDefault();
  try{ fn(el.dataset); }catch(err){ console.error(err); toast('Hov, noget drillede. Prøv igen.'); }
}
app.addEventListener('click', onClick);
app.addEventListener('input', e=>{ if(e.target.id==='hname' && draft) draft.name=e.target.value; });
app.addEventListener('keydown', e=>{ if(e.target.id==='hname' && e.key==='Enter'){ e.preventDefault(); ACT.step({s:2}); } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && document.getElementById('modal') && !document.querySelector('.result')){ ACT.cancelroll(); } });

/* ============================================================
   App (PWA): installation og offline
   ============================================================ */
let installEvt = null;
function standalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installEvt=e; if(view.name==='home'||view.name==='settings') render(); });
window.addEventListener('appinstalled', ()=>{ installEvt=null; toast('Lanterneskoven er installeret 🏮'); });
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ============================================================
   Start
   ============================================================ */
applyPrefs();
const st0 = history.state;
if(st0 && st0.name && VIEWS[st0.name] && st0.name!=='build' && st0.name!=='end'){ view = st0; render(); }
else go('home', null, true);
booted = true;

// til test
window.__LK = {S, STORIES, choicesFor, heroes:()=>heroes};
})();
</script>
