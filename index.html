<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: one reading column like an open picture book; banner of the forest on top, story card with the scene's picture, then big choice buttons. */
:root {
  --bg: #EDF2EE;
  --surface: #FFFFFF;
  --ink: #1B332D;
  --muted: #566D64;
  --line: #CBD8D1;
  --lantern: #E3A21A;
  --lantern-ink: #3A2A00;
  --berry: #A8325E;
  --sky: #2F6A9E;
  --tree1: #BFD5CA;
  --tree2: #93B5A5;
  --good: #2C7A4B;
  --bad: #A8325E;
  --font-display: "Grandstander", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101C19; --surface: #172622; --ink: #E6F0EA; --muted: #9DB5AA; --line: #2B403A;
    --lantern: #F1B93A; --lantern-ink: #2A1E00; --berry: #E07AA0; --sky: #7FB4E3;
    --tree1: #1D332D; --tree2: #264339; --good: #72CE97; --bad: #E07AA0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101C19; --surface: #172622; --ink: #E6F0EA; --muted: #9DB5AA; --line: #2B403A;
  --lantern: #F1B93A; --lantern-ink: #2A1E00; --berry: #E07AA0; --sky: #7FB4E3;
  --tree1: #1D332D; --tree2: #264339; --good: #72CE97; --bad: #E07AA0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.6; padding-inline: 16px; padding-block: 16px 40px; }
.wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.15; margin: 0; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

.banner { border-radius: 20px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.banner svg { display: block; width: 100%; height: auto; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--muted); }
.bar .brand { color: var(--ink); font-weight: 800; font-size: 18px; }
.spark { display: inline-flex; gap: 6px; align-items: center; }
.spark i { width: 14px; height: 18px; border-radius: 4px 4px 7px 7px; background: var(--line); display: inline-block; }
.spark i.on { background: var(--lantern); box-shadow: 0 0 10px var(--lantern); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card h2 { font-size: 28px; font-weight: 800; }
/* Scenens billede fylder hele kortets bredde øverst; er skærmen lav, beskæres det i siderne af SVG'ens slice. */
.scene-art { margin: -22px -20px 0; border-radius: 19px 19px 0 0; overflow: hidden; background: #1E2E52; }
.scene-art svg { display: block; width: 100%; height: auto; max-height: 45vh; }
/* Lanternerækken: en smal stribe under billedet, der lyser mere, jo længere man kommer. */
.lamps { display: flex; justify-content: center; gap: 14px; margin-top: -4px; }
.lamps i { width: 12px; height: 16px; border-radius: 4px 4px 6px 6px; background: var(--line); display: block; position: relative; }
.lamps i::before { content: ""; position: absolute; left: 5px; top: -5px; width: 2px; height: 5px; background: var(--line); }
.lamps i.on { background: var(--lantern); box-shadow: 0 0 10px var(--lantern); }
.story p + p { margin-top: 12px; }
.turn { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--lantern-ink); background: var(--lantern); border-radius: 999px; padding: 3px 14px 3px 6px; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; }
.turn svg { display: block; }
.ask { border-top: 2px dotted var(--line); padding-top: 12px; font-size: 16px; color: var(--muted); }
.ask b { font-family: var(--font-display); color: var(--ink); }

.choices { display: flex; flex-direction: column; gap: 10px; }
.btn { font-family: var(--font-display); font-weight: 600; font-size: 18px; text-align: left; background: var(--surface); border: 2px solid var(--ink); border-radius: 16px; padding: 14px 16px; cursor: pointer; min-height: 52px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.btn:hover { background: var(--lantern); color: var(--lantern-ink); border-color: var(--lantern); }
.btn[disabled] { opacity: .45; cursor: default; text-decoration: line-through; background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn .tag { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.btn:hover .tag { color: var(--lantern-ink); }
.btn.main { background: var(--ink); color: var(--bg); justify-content: center; text-align: center; }
.btn.main:hover { background: var(--lantern); color: var(--lantern-ink); }
.note { font-size: 16px; color: var(--bad); font-weight: 600; }

.dicebox { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; padding: 8px 0; }
.die { width: 92px; height: 92px; border-radius: 22px; border: 3px solid var(--ink); background: var(--surface); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 52px; }
.die.rolling { animation: wob .35s linear infinite; }
@keyframes wob { 0% { transform: rotate(-8deg) } 50% { transform: rotate(8deg) } 100% { transform: rotate(-8deg) } }
@media (prefers-reduced-motion: reduce) { .die.rolling { animation: none } }
.sum { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.sum.win { color: var(--good); } .sum.lose { color: var(--bad); }
.feather { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.feather input { width: 22px; height: 22px; accent-color: var(--lantern); }

.field { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 440px) { .field { grid-template-columns: 1fr; } }
.field input { width: 100%; border: 2px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
.field input:focus { border-color: var(--sky); outline: none; }
.comps { display: grid; gap: 10px; }
.comp { display: flex; align-items: center; gap: 12px; border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; cursor: pointer; background: var(--bg); }
.comp input { position: absolute; opacity: 0; }
.comp:has(input:checked) { border-color: var(--ink); background: var(--lantern); color: var(--lantern-ink); }
.comp:has(input:focus-visible) { outline: 3px solid var(--sky); outline-offset: 2px; }
.comp .nm { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.2; }
.comp .ds { font-size: 15px; }
.comp .pl { margin-left: auto; font-family: var(--font-display); font-weight: 800; font-size: 14px; white-space: nowrap; border: 2px solid currentColor; border-radius: 999px; padding: 2px 10px; }
label.lab { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--muted); }
.stats span { border: 1.5px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.end { text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 40px; color: var(--lantern); letter-spacing: .02em; }

.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { border: 2px solid var(--line); border-radius: 14px; background: var(--bg); padding: 4px 12px 4px 6px; display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 600; font-size: 15px; cursor: pointer; min-height: 44px; }
.tab[aria-pressed="true"] { border-color: var(--ink); background: var(--lantern); color: var(--lantern-ink); }
.tab.add { padding-left: 14px; color: var(--muted); border-style: dashed; }
.builder { display: grid; grid-template-columns: 164px minmax(0, 1fr); gap: 16px; }
.mini .srow { gap: 4px; font-size: 12px; }
.mini .srow .sn { width: 80px; white-space: nowrap; }
.mini .pip { width: 10px; height: 10px; }
@media (max-width: 480px) { .builder { grid-template-columns: 1fr; } }
.prev { display: flex; flex-direction: column; gap: 8px; align-items: center; background: var(--bg); border-radius: 16px; padding: 8px; align-self: start; }
.sw { font-family: var(--font-display); font-weight: 800; color: var(--muted); line-height: 1; }
.opts { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grp { display: flex; flex-direction: column; gap: 6px; }
.gl { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-display); font-weight: 600; font-size: 14px; border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 12px; min-height: 36px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.chip.rm { color: var(--bad); }
.sw { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--surface); }
.heroes { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.heroes figure { margin: 0; text-align: center; }
.heroes figcaption { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
.nm-in { width: 100%; border: 2px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
.nm-in:focus { border-color: var(--sky); outline: none; }

.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.w { border-radius: 4px; transition: background .15s; }
.w.on { background: var(--lantern); color: var(--lantern-ink); box-shadow: 0 0 0 3px var(--lantern); }
.big .story { font-size: 24px; line-height: 1.7; }
.big .btn { font-size: 21px; }
.crow { display: flex; gap: 8px; }
.crow .btn { flex: 1; min-width: 0; }
.spk { flex: 0 0 52px; width: 52px; min-height: 52px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); cursor: pointer; display: grid; place-items: center; padding: 0; }
.spk:hover { border-color: var(--ink); }
.spk svg { width: 24px; height: 24px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.vnote { font-size: 14px; color: var(--muted); }

.hcard { display: flex; gap: 10px; align-items: center; border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; background: var(--bg); }
.hcard:has(input:checked) { border-color: var(--ink); box-shadow: 0 0 0 2px var(--lantern); }
.hcard > input { width: 22px; height: 22px; accent-color: var(--lantern); flex: none; }
.hcard .hi { min-width: 0; flex: 1; display: flex; gap: 10px; align-items: center; cursor: pointer; }
.hcard .hx { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.hcard .hn { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.2; overflow-wrap: anywhere; }
.srow { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 13px; }
.srow .sn { width: 96px; color: var(--muted); }
.pips { display: flex; gap: 3px; }
.pip { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: inline-block; }
.pip.on { background: var(--lantern); box-shadow: 0 0 0 1.5px var(--lantern-ink) inset; }
.srow.big { font-size: 16px; padding: 8px 0; border-bottom: 1px dotted var(--line); }
.srow.big .sn { flex: 1; width: auto; color: var(--ink); min-width: 0; }
.srow.big small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); font-family: var(--font-body); }
.step { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--ink); background: var(--surface); font-family: var(--font-display); font-weight: 800; font-size: 22px; cursor: pointer; padding: 0; line-height: 1; }
.step[disabled] { opacity: .35; border-color: var(--line); cursor: default; }
.badge { font-family: var(--font-display); font-weight: 800; font-size: 13px; background: var(--lantern); color: var(--lantern-ink); border-radius: 999px; padding: 2px 10px; align-self: flex-start; }
.pts { font-family: var(--font-display); font-weight: 800; font-size: 17px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rew { background: var(--bg); border: 2px dashed var(--lantern); border-radius: 14px; padding: 10px 14px; font-size: 16px; }
.mini { display: flex; flex-direction: column; gap: 3px; width: 100%; }
.btn.locked, .btn[disabled].locked { text-decoration: none; opacity: .7; border-style: dashed; border-color: var(--muted); }
.btn .tag.lk { white-space: normal; text-align: right; max-width: 46%; font-size: 12px; }
.namebox { display: flex; flex-direction: column; gap: 8px; border: 2px dashed var(--lantern); border-radius: 14px; padding: 12px 14px; background: var(--bg); }
.gdot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; box-shadow: 0 0 8px currentColor; border: 2px solid var(--ink); }
.magibar { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--font-display); font-weight: 600; font-size: 13px; }
.mg { border: 1.5px solid var(--lantern); border-radius: 999px; padding: 2px 10px; background: var(--bg); }
.mg.used { opacity: .5; border-color: var(--line); }
.btn.magic, .btn.magic[disabled] { border-style: dashed; border-color: var(--lantern); }
.hcard .mgl { font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--muted); }
.foot { font-size: 14px; color: var(--muted); text-align: center; }
.foot a { color: var(--sky); font-weight: 600; display: inline-block; padding: 8px 6px; }
.btn.max, .btn[disabled].max { border-color: var(--lantern); box-shadow: inset 0 0 0 2px var(--lantern); }
.lvl { font-family: var(--font-display); font-weight: 800; font-size: 13px; color: var(--lantern-ink); background: var(--lantern); border-radius: 999px; padding: 1px 10px; }
.rew.up { border-style: solid; }
.wlist { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
/* Heltebilledet følger med, mens man vælger */
.pvtag { font-family: var(--font-display); font-weight: 800; font-size: 12px; background: var(--berry); color: #fff; border-radius: 999px; padding: 1px 9px; margin-left: 8px; vertical-align: middle; }
.prev { position: sticky; top: 8px; z-index: 3; }
.prev svg { max-width: 100%; height: auto; }
@media (max-width: 480px) {
  .prev { top: 0; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 8px 12px; border: 1px solid var(--line); box-shadow: 0 4px 10px rgba(0, 0, 0, .12); }
  .prev svg { width: 64px; flex: none; }
  .prev .mini { display: none; }
}
</style>
</head>

  <div class="banner" aria-hidden="true">
    <svg viewBox="0 0 640 150" xmlns="http://www.w3.org/2000/svg">
      <g fill="var(--tree1)">
        <path d="M0 150 L0 90 L30 40 L60 95 L90 50 L125 110 L150 150Z"/><path d="M330 150 L350 80 L385 30 L420 85 L450 55 L490 120 L510 150Z"/><path d="M560 150 L580 70 L610 35 L640 85 L640 150Z"/>

  <div class="bar"><span><span class="brand">Lanterneskoven</span><span class="pvtag" id="pvtag" hidden>Forhåndsvisning</span></span><span><span id="epi">Del 1 af 4</span> &middot; <span class="spark" id="spark" aria-label="Gnister fundet"></span></span></div>

  <main id="stage" class="card"></main>

<script>
(function () {
  var D = LK.data;
  var COMPS = D.comps, MAGICS = D.magics, STATS = D.stats, FRIEND_FLAGS = D.friendFlags;
  /* Historierne registrerer sig med LK.addStory (se LK.start nederst). STORIES har samme rækkefølge som kataloget:
     sagaens dele og derefter de synlige månedshistorier. ENTRY er katalogets post for hver historie (type, udgives). */
  var STORIES = [], ENTRY = {};
  var MAANEDER = ['januar', 'februar', 'marts', 'april', 'maj', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'december'];
  function storyById(id) { return STORIES.filter(function (x) { return x.id === id; })[0] || null; }
  function erMaaned(id) { return !!ENTRY[id] && ENTRY[id].type === 'maaned'; }
  function sagaDele() { return STORIES.filter(function (x) { return !erMaaned(x.id); }); }
  function sagaIndex(id) { return sagaDele().map(function (x) { return x.id; }).indexOf(id); }
  function nextStory(id) { var i = sagaIndex(id); return i < 0 ? null : sagaDele()[i + 1] || null; }
  function storyStart(id) { return storyById(id).start; }
  /* 'ÅÅÅÅ-MM-DD' -> 'december 2026' */
  function maanedTekst(dato) { var d = String(dato || '').split('-'); return (MAANEDER[+d[1] - 1] || '') + ' ' + d[0]; }
  function overskrift(id) {
    if (erMaaned(id)) return 'Månedens eventyr · ' + maanedTekst(ENTRY[id].udgives);
    return 'Del ' + (sagaIndex(id) + 1) + ' af ' + sagaDele().length;
  }

  /* ?preview=<id> spiller én historie uanset dato med et eksempelhold. Så gemmes der intet på enheden:
     al brug af localStorage går gennem store, som ikke skriver i forhåndsvisningen. */
  var PARAMS = new URLSearchParams(location.search);
  var PREVIEW_ID = PARAMS.get('preview') || null;
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { if (PREVIEW_ID) return; try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var state;
  var kit = LK.lavKit(function () { return state; });
  var esc = kit.esc, gen = kit.gen, joinNames = kit.joinNames, friendNames = kit.friendNames, gnistNames = kit.gnistNames;
  /* Levels (udkast): et level hvert LEVEL_EVERY. gennemførte eventyr. Ekstra magi fra SECOND_MAGIC_LEVEL. */
  var LEVEL_EVERY = 2, SECOND_MAGIC_LEVEL = 3;
  function heroLevel(h) { return 1 + Math.floor(((h && h.stories) || 0) / LEVEL_EVERY); }
  function storiesToLevel(h, L) { return Math.max(0, (L - 1) * LEVEL_EVERY - ((h && h.stories) || 0)); }
  function magicById(id) { return MAGICS.filter(function (m) { return m.id === id; })[0] || null; }
  function magicOf(h) { return magicById(h.magic); }
  function heroMagics(h) {
    var a = [], m1 = magicOf(h), m2 = (heroLevel(h) >= SECOND_MAGIC_LEVEL && h.magic2 && h.magic2 !== h.magic) ? magicById(h.magic2) : null;
    if (m1) a.push(m1); if (m2) a.push(m2); return a;
  }
  function magicUses(h, m) { return m ? 1 + ((h.stats && h.stats[m.stat] >= 3) ? 1 : 0) : 0; }
  function magicLeft(h, m) { return magicUses(h, m) - (state.magicUsed[h.id + ':' + m.id] || 0); }
  function useMagic(h, m) { var k = h.id + ':' + m.id; state.magicUsed[k] = (state.magicUsed[k] || 0) + 1; }
  var MAGIC_NOTE = {
    gnist: function (n) { return n + ' skabte en lille ny gnist med sin gnistmagi.'; },
    dyr: function (n) { return n + ' talte dyrenes sprog, og de hjalp gerne.'; },
    syn: function (n) { return n + ' så det skjulte med sit magiske syn.'; },
    latter: function (n) { return n + ' strøede latterstøv, og pludselig fik alle lyst til at grine.'; }

    if ($('cancel')) $('cancel').onclick = function () {
      if (!setup.isNew && setup.orig) { var o = JSON.parse(setup.orig); for (var k in o) h[k] = o[k]; }
      setup.view = 'lib'; renderSetup();
    };
    if ($('del')) $('del').onclick = function () {
      if (!setup.confirmDel) { setup.confirmDel = true; this.textContent = 'Tryk igen for at slette'; return; }
      lib.heroes = lib.heroes.filter(function (x) { return x.id !== h.id; }); delete lib.play[h.id];
      saveLib();
      if (!lib.heroes.length) { setup.edit = makeHero(0); setup.isNew = true; setup.snap = zeroStats(); setup.cat = 'kraefter'; }
      else setup.view = 'lib';
      renderSetup();
    };
  }

  function renderBuilder() {
    var h = setup.edit, cat = setup.cat || 'ansigt';
    $('ptsline').innerHTML = 'Point at bruge: <span class="badge">' + h.pts + '</span> <span class="lvl">Level ' + heroLevel(h) + '</span><span class="vnote">næste level om ' + storiesToLevel(h, heroLevel(h) + 1) + (storiesToLevel(h, heroLevel(h) + 1) === 1 ? ' eventyr' : ' eventyr') + '</span>';
    var cats = '<div class="chips">' + CATS.map(function (c) { return '<button type="button" class="chip" data-cat="' + c[0] + '" aria-pressed="' + (cat === c[0]) + '">' + c[1] + '</button>'; }).join('') + '</div>';
    var body;
    if (cat === 'kraefter') {
      body = grp('Fordel dine point', STATS.map(function (t) {
        var k = t[0];
        return '<div class="srow big"><span class="sn"><b>' + k + '</b>' + (h.stats[k] >= 5 ? ' ⭐ Mester' : '') + '<small>' + t[1] + '</small><span class="pips">' + pips(h.stats[k]) + '</span></span>' +
          '<button type="button" class="step" data-st="' + k + '" data-d="-1" aria-label="Mindre ' + k + '"' + (h.stats[k] <= setup.snap[k] ? ' disabled' : '') + '>−</button>' +
          '<button type="button" class="step" data-st="' + k + '" data-d="1" aria-label="Mere ' + k + '"' + (h.pts <= 0 || h.stats[k] >= 5 ? ' disabled' : '') + '>+</button></div>';
      }).join('')) + '<p class="vnote">Højst 5 i hver. Du kan gemme point til senere. Hver ny måned får din helt 1 point, og efter hvert gennemført eventyr får den 1 point mere.</p>' +
        '<p class="vnote">⭐ Når et træk når 5, bliver din helt mester i det. Så åbner der sig særlige valg i eventyrene (ét mester-valg pr. træk pr. eventyr).</p>';
    } else if (cat === 'magi') {
      var mg = magicOf(h), lvOk = heroLevel(h) >= SECOND_MAGIC_LEVEL, mg2 = lvOk && h.magic2 ? magicById(h.magic2) : null;
      function magNote(m) { return m ? '<p class="vnote"><b>' + m.name + ':</b> ' + m.desc + ' Kan bruges ' + magicUses(h, m) + (magicUses(h, m) === 1 ? ' gang' : ' gange') + ' pr. eventyr. Med mindst 3 i ' + m.stat + ' kan den bruges to gange.</p>' : ''; }
      body = grp(lvOk ? 'Din første magi' : 'Vælg din magi', chipsHtml('magic', MAGICS.map(function (m) { return [m.id, m.name + ' · ' + m.stat]; }), h.magic)) + magNote(mg) +
        (lvOk
          ? grp('Din anden magi (åbnet på level ' + SECOND_MAGIC_LEVEL + ')', chipsHtml('magic2', [['', 'Ingen']].concat(MAGICS.filter(function (m) { return m.id !== h.magic; }).map(function (m) { return [m.id, m.name + ' · ' + m.stat]; })), h.magic2 && h.magic2 !== h.magic ? h.magic2 : '')) + (mg2 && mg2.id !== h.magic ? magNote(mg2) : '')
          : '<p class="vnote">🔒 På level ' + SECOND_MAGIC_LEVEL + ' kan din helt vælge en ekstra magi. Det er om ' + storiesToLevel(h, SECOND_MAGIC_LEVEL) + ' eventyr.</p>');
    } else {
      body = GROUPS[cat].map(function (g) {
        if (g[1] === 'sw') return grp(g[0], swHtml(g[2], g[3], h[g[2]], g[0]));
        if (g[1] === 'acc') return grp(g[0], chipsHtml(g[2], g[3].map(function (a) { return [a[0], a[1] + (a[2] ? ' · ' + a[2] : '')]; }), h[g[2]]));
        return grp(g[0], chipsHtml(g[2], g[3], h[g[2]]));
      }).join('');
    }
    $('builder').innerHTML = '<div class="prev">' + avatar(h, 140) + '<span class="badge">Point: ' + h.pts + '</span>' + miniStats(h) + '<button type="button" class="chip" id="rnd">Overrask mig</button></div><div class="opts">' + cats + body + '</div>';
  }

  function awardHtml() {
    if (!state.players.length) return '';
    var m = monthIdx(), got = [], had = [];
    if (!state.awarded) {
      state.awarded = true;
      state.players.forEach(function (p) {
        var lv0 = heroLevel(p);
        p.stories = (p.stories || 0) + 1;
        if (heroLevel(p) > lv0) state.levelNow = (state.levelNow || []).concat({ n: p.name, lv: heroLevel(p) });
        /* 1 point efter hvert gennemført eventyr (ikke længere begrænset til én gang pr. måned) */
        p.pts = (p.pts || 0) + 1; p.bonusMonth = m; got.push(p.name); state.gotNow = (state.gotNow || []).concat(p.name);
      });
      /* En månedshistorie står for sig selv: den gemmer kun, at den er spillet, og ændrer ikke sagaens venner og gnister. */
      var saga = !erMaaned(state.story);
      if (saga) FRIEND_FLAGS.forEach(function (k) { if (state.flags[k]) lib.world[k] = true; });
      lib.world['done_' + state.story] = true;
      if (saga && state.story === 'lantern' && state.gnistList.length) lib.world.gnistNavne = gnistNames();
      saveLib();
      state.hadNow = had;
    }
    var g = state.gotNow || [];
    var up = (state.levelNow || []).map(function (u) {
      return '<div class="rew up">⭐ <b>Level op!</b> ' + esc(u.n) + ' er nu level ' + u.lv + '.' + (u.lv === SECOND_MAGIC_LEVEL ? ' Nu kan ' + esc(u.n) + ' vælge en ekstra magi under Forbedre helte.' : '') + '</div>';
    }).join('');
    if (g.length) return up + '<div class="rew"><b>Belønning:</b> ' + g.map(esc).join(', ') + ' fik 1 point. Brug det under Forbedre helte.</div>';
    return up + '<div class="rew">Månedens bonuspoint er allerede givet. Næste måned får heltene nye point.</div>';
  }
  function turnLine(isChoice) {
    var pl = state.players;
    if (!pl.length) return '';
    var p = pl[state.turn % pl.length];
    return '<span class="turn">' + avatar(p, 30) + esc(p.name) + (isChoice ? ' vælger' : ' læser højt') + '</span>';
  }

  function enter(id) {
    var sc = S[id];
    state.scene = id;
    if (sc.path && state.visited.indexOf(sc.path) < 0) state.visited.push(sc.path);
    if (sc.gain && !sc.done) { state.gnists++; if (sc.gnist) state.gnistList.push({ key: id, c: sc.gnist.c, def: sc.gnist.def, col: sc.gnist.col, ph: sc.gnist.ph, name: '' }); }
    if (sc.gainFeather) state.feather = true;
    if (sc.flag) state.flags[sc.flag] = true;
    state.compNote = compRemark(id, sc);
    render();
  }

  function render() {
    var id = state.scene, sc = S[id];
    stopSpeak();
    setSpark();
    var lit = sc.all ? 6 : sc.lit != null ? sc.lit : 1 + state.gnists * 2 + (state.visited.length > 0 ? 1 : 0);
    var paras = typeof sc.text === 'function' ? sc.text() : sc.text;
    if (state.magicNote) { paras = [state.magicNote].concat(paras); state.magicNote = ''; }
    if (state.compNote) paras = paras.concat([state.compNote]);
    var choices = sc.dyn ? sc.dyn() : (sc.choices || (sc.next ? [{ label: 'Læs videre', to: sc.next, main: true }] : []));
    if (!sc.end) choices = choices.concat(magicChoices(id), maxChoices(id));
    var isChoice = choices.length > 1;
    var askTxt = typeof sc.ask === 'function' ? sc.ask() : sc.ask;
    var gi = sc.gnist ? state.gnistList.filter(function (g) { return g.key === id; })[0] : null;
    var nameBox = gi ? '<div class="namebox"><label class="lab" for="gn"><i class="gdot" style="background:' + gi.col + '"></i>Giv den ' + gi.c + ' gnist et navn</label><input class="nm-in" id="gn" maxlength="14" placeholder="Fx ' + gi.ph + '" value="' + esc(gi.name) + '"></div>' : '';
    var h = artHtml(id) + lampsHtml(lit) + (sc.end ? '<div class="end" aria-hidden="true">Slut</div>' : '') +
      '<h2>' + sc.title + '</h2>' + turnLine(isChoice) + toolsHtml() +
      '<div class="story">' + storyHtml(paras) + '</div>' + nameBox +
      '<div class="ask"><b>Spørg børnene:</b> ' + askTxt + '</div>';
    if (sc.end) {
      if (state.players.length) h += '<div class="heroes">' + state.players.map(function (p) { return '<figure>' + avatar(p, 72) + '<figcaption>' + esc(p.name) + '</figcaption></figure>'; }).join('') + '</div>';
      h += awardHtml();
      h += '<div class="stats">' + (state.story === 'lantern' ? '<span>Gnister: ' + (state.gnists ? joinNames(gnistNames()) : '0') + '</span>' : '') + (friendNames(state.flags).length ? '<span>Venner: ' + joinNames(friendNames(state.flags)) + '</span>' : '') + '<span>Terningkast: ' + state.rolls + '</span><span>Følgesvend: ' + esc(state.compName) + '</span></div>' +
        '<div class="choices"><button class="btn main" id="again" type="button">Læs eventyret igen</button>' + (erMaaned(state.story) ? '<button class="btn" id="back" type="button">Tilbage til historierne</button>' : nextStory(state.story) ? '<button class="btn" id="nextstory" type="button">Spil næste del: ' + nextStory(state.story).title + '</button>' : '') + '<button class="btn" id="team" type="button">Forbedre helte</button></div>';
    } else {
      h += magiBar() + '<p class="note" id="wrongnote" hidden></p><div class="choices" id="choices"></div>';
    }
    stage.innerHTML = h;
    bindTools(choices, !!sc.end);
    if (gi) $('gn').oninput = function () { gi.name = this.value; };
    $('epi').textContent = overskrift(state.story);
    stage.scrollIntoView({ block: 'start', behavior: 'auto' });
    if (sc.end) {
      $('again').onclick = function () { var st = state.story; fresh({ players: state.players, comp: state.comp, story: st }); enter(storyStart(st)); };
      if ($('nextstory')) $('nextstory').onclick = function () { var ns = nextStory(state.story); fresh({ players: state.players, comp: state.comp, story: ns.id }); enter(ns.start); };
      $('team').onclick = function () { var c = state.comp; fresh({ players: state.players, comp: c }); setup.comp = c; setup.view = 'lib'; renderSetup(); };
      if ($('back')) $('back').onclick = $('team').onclick;
      return;
    }
    var box = $('choices');
    choices.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn' + (c.main ? ' main' : '') + (c.mag ? ' magic' : '') + (c.maxStat ? ' max' : '');
      var wr = state.wrong[c.key], lk = c.lock ? c.lock() : null;
      b.innerHTML = '<span>' + c.label + '</span>' + (lk ? '<span class="tag lk">' + lk + '</span>' : c.mag ? '<span class="tag">✨ Magi</span>' : c.maxStat ? '<span class="tag">⭐ Mester</span>' : c.roll ? '<span class="tag">🎲 ' + c.roll.stat + '</span>' : '');
      if (wr || lk) b.disabled = true;
      if (lk) b.classList.add('locked');
      b.onclick = function () {
        if (c.mag) {
          useMagic(c.mag, c.mobj); if (c.opt.eff) c.opt.eff(c.mag);
          state.magicNote = MAGIC_NOTE[c.mobj.id](c.mag.name);
          state.turn++; enter(c.to); return;
        }
        if (c.maxStat) {
          state.maxUsed[c.maxStat] = true;
          if (c.maxOpt.eff) c.maxOpt.eff(c.maxHero, c.maxStat);
          if (c.maxOpt.n) state.magicNote = c.maxOpt.n(esc(c.maxHero.name));
          state.turn++; enter(c.to); return;
        }
        if (c.roll) { if (c.key) state.wrong[c.key] = true; return startRoll(c); }
        if (c.wrong) { state.wrong[c.key] = true; b.disabled = true; var n = $('wrongnote'); n.innerHTML = c.wrong; n.hidden = false; return; }
        if (c.use) { state.usedG[c.use] = true; state.lastUse = c.use; }
        state.turn++;
        enter(c.to);
      };
      var row = document.createElement('div'); row.className = 'crow'; row.appendChild(b);
      if (speech.ok && !c.main && !lk) {
        var sk = document.createElement('button'); sk.type = 'button'; sk.className = 'spk'; sk.setAttribute('aria-label', 'Læs muligheden højt'); sk.innerHTML = SPK;
        sk.onclick = function () { speak(plain(c.label), false); };
        row.appendChild(sk);
      }
      box.appendChild(row);
    });
  }

  function startRoll(c) {
    var r = c.roll;
    var who = state.players[state.turn % state.players.length] || { name: 'I', stats: {}, acc: '' };
    var base = (who.stats && who.stats[r.stat]) || 0;
    var cb = state.compStat === r.stat ? 1 : 0;
    var acc = accStat(who.acc) === r.stat ? 1 : 0;
    var fb = r.flag && state.flags[r.flag] ? 1 : 0;
    var val = base + cb + acc + fb;
    var ok = 0; for (var q = 1; q <= 6; q++) if (q + val >= r.target) ok++;
    var pct = Math.round(ok / 6 * 100);
    var lvl = pct >= 83 ? 'Nemt' : pct >= 50 ? 'Middel' : pct > 0 ? 'Svært' : 'Meget svært';
    var canFeather = state.feather && !state.featherUsed;
    var box = $('choices');
    box.innerHTML = '<div class="dicebox">' +
      '<div class="sum">Slå mindst ' + r.target + ' i alt.<br>' + esc(gen(who.name)) + ' ' + r.stat + ': ' + base + (cb ? ' + 1 fra ' + esc(state.compName) : '') + (acc ? ' + 1 fra ' + accName(who.acc).toLowerCase() : '') + (fb ? ' + 1 ' + r.flagTxt : '') + '<br>' + lvl + ' (' + pct + ' % chance)</div>' +
      '<div class="die" id="die" aria-live="polite">?</div>' +
      (canFeather ? '<label class="feather"><input type="checkbox" id="fe"> Brug Uffes fjer (+1)</label>' : '') +
      '<div class="sum" id="res"></div>' +
      '<button class="btn main" id="roll" type="button" style="width:100%">Slå terningen</button></div>';
    var rollOnce = function () {
      var die = $('die'), btn = $('roll');
      var old = $('shield'); if (old) old.remove();
      btn.disabled = true;
      var fe = canFeather && !state.featherUsed && $('fe').checked;
      if (canFeather) $('fe').disabled = true;
      die.classList.add('rolling');
      var t = setInterval(function () { die.textContent = 1 + Math.floor(Math.random() * 6); }, 70);
      setTimeout(function () {
        clearInterval(t);
        die.classList.remove('rolling');
        var d = 1 + Math.floor(Math.random() * 6);
        die.textContent = d;
        state.rolls++;
        if (fe) state.featherUsed = true;
        var total = d + val + (fe ? 1 : 0);
        var win = total >= r.target;
        var res = $('res');
        res.className = 'sum ' + (win ? 'win' : 'lose');
        res.textContent = d + ' + ' + val + (fe ? ' + 1' : '') + ' = ' + total + (win ? '. Det lykkes!' : '. Det lykkedes ikke denne gang.');
        btn.disabled = false;
        btn.textContent = 'Læs videre';
        if (prefs.auto) speak(res.textContent, false);
        btn.onclick = function () { state.turn++; enter(win ? r.win : r.lose); };
        var sh = win ? null : shieldHero();
        if (sh) {
          var sb = document.createElement('button');
          sb.type = 'button'; sb.id = 'shield'; sb.className = 'btn magic'; sb.style.width = '100%';
          sb.textContent = 'Brug ' + gen(sh.h.name) + ' Lysskjold: slå igen';
          btn.parentNode.insertBefore(sb, btn);
          sb.onclick = function () { useMagic(sh.h, sh.m); sb.remove(); res.textContent = ''; res.className = 'sum'; btn.textContent = 'Slå terningen'; btn.onclick = rollOnce; rollOnce(); };
        }
      }, 900);
    };
    $('roll').onclick = rollOnce;
  }

  /* Forhåndsvisningens eksempelhold: Asta og Bo med 2 i hvert træk og Bastian Bjørn. Gemmes aldrig. */
  function startPreview() {
    $('pvtag').hidden = false;
    var st = storyById(PREVIEW_ID);
    var helte = ['Asta', 'Bo'].map(function (navn, i) {
      var h = makeHero(i);
      h.id = 'eksempel' + (i + 1); h.name = navn; h.pts = 0;
      STATS.forEach(function (t) { h.stats[t[0]] = 2; });
      return h;
    });
    lib = { heroes: helte, play: { eksempel1: true, eksempel2: true }, world: {} };
    setup.view = 'lib'; setup.edit = null; setup.isNew = false; setup.comp = 'bjorn';
    if (!st) {
      $('epi').textContent = 'Forhåndsvisning';
      stage.innerHTML = '<h2>Historien findes ikke</h2><p>Forhåndsvisningen kunne ikke finde historien &laquo;' + esc(PREVIEW_ID) + '&raquo;.</p><button class="btn main" id="tilliste" type="button">Til historierne</button>';
      $('tilliste').onclick = function () { renderSetup(); };
      return;
    }
    setup.story = st.id;
    fresh({ players: helte, comp: 'bjorn', story: st.id });
    enter(st.start);
  }

  /* ?katalog=<sti> er kun til testene: et andet katalog, fx tests/fixtures/stories-maaned/katalog.js. */
  function hentKatalog(videre) {
    var sti = PARAMS.get('katalog');
    if (!sti || !/^[A-Za-z0-9_\-\/]+\.js$/.test(sti) || sti.charAt(0) === '/') return videre();
    var el = document.createElement('script');
    el.src = sti;
    el.onload = el.onerror = function (e) { if (e.type === 'error') console.error('Kunne ikke hente kataloget ' + sti); videre(); };
    document.head.appendChild(el);
  }

  /* Læs kataloget, hent de synlige historier som <script>, og start appen, når alle er hentet eller fejlet. */
  LK.start = function () { hentKatalog(hentHistorier); };
  function hentHistorier() {
    var poster = LK.synlige(LK.katalogPoster || [], new Date(), PREVIEW_ID);
    var mangler = poster.length;
    poster.forEach(function (p) { ENTRY[p.id] = p; });
    function klar() {
      var orden = poster.map(function (p) { return p.id; });
      function plads(id) { var i = orden.indexOf(id); return i < 0 ? orden.length : i; }
      STORIES.sort(function (a, b) { return plads(a.id) - plads(b.id); });
      $('about').onclick = function (e) { e.preventDefault(); renderWelcome(true); };
      if (PREVIEW_ID) startPreview();
      else if (welcomed) renderSetup(); else renderWelcome(false);
    }
    if (!mangler) return klar();
    poster.forEach(function (p) {
      var el = document.createElement('script');
      el.src = p.fil;
      el.async = false;
      el.onload = el.onerror = function (e) {
        if (e.type === 'error') console.error('Kunne ikke hente historien ' + p.fil);
        if (--mangler === 0) klar();
      };
      document.head.appendChild(el);
    });
  }
})();
LK.start();
</script>

<script>
/* App-delen: installation og brug uden internet */
(function () {
  var evt = null, link = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); evt = e; link.hidden = false; });
  window.addEventListener('appinstalled', function () { evt = null; link.hidden = true; });
  link.onclick = function (e) { e.preventDefault(); if (!evt) return; evt.prompt(); evt.userChoice.finally(function () { evt = null; link.hidden = true; }); };
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
