name: Tjek historierne

on:
  pull_request:

jobs:
  tjek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enhedstests
        run: node --test 'tests/*.test.mjs'
      - name: Tjek af historier
        run: node tools/tjek-historier.mjs
